"display-metrics.js": function (module, exports, require) {
// Collects every string the UI shows for metrics, so tests can scan them.
const { CHANNELS, SCALE } = require('./config');
const { scaled, fmtCount, fmtMoney, fmtChartValue } = require('./format');
const { applyFilters, consentWaterfall, projectResults, projectionDisplay, assumptionText, combineProjections } = require('./segments');
const { fanProfileView, ROLES } = require('./views-profile');

const CHANNEL_IDS = CHANNELS.map((c) => c.id);

// Every channel subset of size 2 to 4 (11 for four channels), in stable order.
function channelSubsets() {
  const out = [];
  for (let mask = 1; mask < (1 << CHANNEL_IDS.length); mask++) {
    const ids = CHANNEL_IDS.filter((_, i) => mask & (1 << i));
    if (ids.length >= 2) out.push(ids);
  }
  return out;
}

function addChart(out, c) {
  out.push(c.title, ...c.labels.map(String));
  for (const s of c.series) {
    out.push(s.name);
    for (const v of s.data) if (v !== null) out.push(fmtChartValue(v, c.unit));
  }
}

function addEvidenceChart(out, c, unit) {
  out.push(...c.labels);
  for (const row of c.series) for (const v of row) out.push(fmtChartValue(v, unit));
}

function addWaterfall(out, w) {
  out.push(...w.display.labels, w.display.totalLabel, ...w.steps.map((s) => s.label));
}

// Known-optional fields are skipped when absent; everything else is pushed as-is.
const optional = (out, ...vals) => { for (const v of vals) if (v !== undefined && v !== null) out.push(v); };

function collectDisplayedStrings(model) {
  const out = [];
  const { views, fans, world, recommendations } = model;

  for (const v of [views.ticketing, views.fnb, views.groups]) {
    optional(out, v.intro, v.cantTell);
    for (const k of v.kpis) out.push(k.label, k.value);
    for (const c of v.charts) addChart(out, c);
  }

  const f = views.fan360;
  for (const k of f.kpis) { out.push(k.label, k.value); optional(out, k.note); }
  out.push(...f.funnel.labels, f.funnel.totalLabel, ...f.funnel.names);
  out.push(...f.matchBreakdown.labels, f.matchBreakdown.totalLabel, ...f.matchBreakdown.names);
  addChart(out, f.overlap);
  addChart(out, f.valueBySystems);
  out.push(...Object.values(f.takeaways));

  for (const id of CHANNEL_IDS) addWaterfall(out, consentWaterfall(fans, id));
  for (const ch of CHANNELS) out.push(assumptionText(ch));

  for (const card of recommendations) {
    out.push(
      card.name, card.ruleText, card.valueAssumption, card.whyNow,
      fmtCount(scaled(card.matched)), fmtCount(scaled(card.eligible)), fmtMoney(card.projectedValue),
      card.evidence.label, card.evidence.baselineLabel, card.evidence.segmentValue, card.evidence.baselineValue,
    );
    addEvidenceChart(out, card.evidence.chart, card.evidence.chart.unit);
    if (card.sponsorAudience) out.push(card.sponsorAudience, card.sponsorAudienceSize);
    const audience = applyFilters(fans, card.filters);
    for (const id of CHANNEL_IDS) {
      const w = consentWaterfall(audience, id);
      addWaterfall(out, w);
      const disp = projectionDisplay(projectResults(w.eligible, [id]));
      for (const c of disp.perChannel) { out.push(c.label); for (const r of c.rows) out.push(r.label, r.value); }
      for (const r of disp.combined) out.push(r.label, r.value);
    }
    for (const ids of channelSubsets()) {
      const results = ids.map((id) => projectResults(consentWaterfall(audience, id).eligible, [id]));
      for (const r of combineProjections(results)) out.push(r.label, r.value);
    }
  }

  for (const hero of fans.filter((x) => x.heroId)) {
    for (const role of Object.keys(ROLES)) {
      const p = fanProfileView(hero, role, world);
      out.push(p.header.name, p.header.region, p.header.roleLabel, p.header.confidence);
      for (const fld of p.fields) out.push(fld.label, fld.value);
      for (const h of p.household) out.push(h.label, h.value);
      for (const lane of p.swimlanes) for (const e of lane.events) out.push(e.label);
    }
  }
  return out;
}

const NS = SEASONS.length;

function regionForZip(zip) {
  const z = Number(String(zip || '').slice(0, 3));
  if (z >= 550 && z <= 567) return 'Home state';
  if (z >= 530 && z <= 549) return 'Neighbor state (east)';
  if (z >= 500 && z <= 528) return 'Neighbor state (south)';
  if (z >= 570 && z <= 588) return 'Neighbor states (west)';
  return 'Other';
}

// Season-indexed typed arrays (index = fan * NS + season offset) keep the hot loops cheap;
// they become { 2024, 2025, 2026 } objects once at the end. The object literal is much faster
// than assigning integer keys one by one, so the seasons are spelled out here.
if (NS !== 3 || Y0 !== 2024) throw new Error('fans.js bySeason expects seasons 2024–2026');
const same = (v) => v;
function bySeason(arr, i, map = same) {
  const b = i * NS;
  return { 2024: map(arr[b]), 2025: map(arr[b + 1]), 2026: map(arr[b + 2]) };
}

function buildFans(world, linkage) {
  const clusters = linkage.clusters;
  const nf = clusters.length;
  const plan = new Uint8Array(nf * NS);
  const games = new Uint16Array(nf * NS);
  const ticketGames = new Uint16Array(nf * NS);
  const xfer = new Uint16Array(nf * NS);
  const fnb = new Float64Array(nf * NS);
  const retail = new Uint8Array(nf * NS);
  const spend = new Float64Array(nf * NS);
  const active = new Uint8Array(nf * NS);
  const sysT = new Uint8Array(nf), sysF = new Uint8Array(nf), sysG = new Uint8Array(nf);
  const outings = new Uint16Array(nf);
  const premOwn = new Uint16Array(nf), premXfer = new Uint16Array(nf), premGroup = new Uint16Array(nf);
  const surveySat = new Array(nf).fill(null);
  const surveySeason = new Int16Array(nf).fill(-1);
  const kids = Array.from({ length: nf }, () => []);
  const consentDetail = Array.from({ length: nf }, () => ({}));
  const dnc = new Uint8Array(nf);
  const planNames = Object.keys(PLAN_RANK);
  const planIdx = Object.fromEntries(planNames.map((p, i) => [p, i]));

  const byNode = new Map();
  clusters.forEach((c, i) => { for (const n of c.nodes) byNode.set(`${n.source}:${n.id}`, i); });
  const fanFor = (source, id) => byNode.get(`${source}:${id}`);
  const si = (yr) => yr - Y0;

  // ---- ticketing accounts and scans ----
  const byTkt = new Map();
  for (const t of world.ticketing) {
    const f = fanFor('ticketing', t.tktId);
    byTkt.set(t.tktId, f);
    sysT[f] = 1;
    for (const yr of SEASONS) {
      const s = t.seasons[yr];
      const k = f * NS + si(yr);
      if (PLAN_RANK[s.plan] > PLAN_RANK[planNames[plan[k]]]) plan[k] = planIdx[s.plan];
      xfer[k] += s.transfersSent;
      spend[k] += s.ticketSpend;
      if (s.plan !== 'none') active[k] = 1;
    }

  for (const s of world.scans) {
    if (!s.tktId) continue;
    const f = byTkt.get(s.tktId);
    const k = f * NS + si(s.season);
    ticketGames[k]++;
    games[k]++;
    active[k] = 1;
    if (PREMIUM.has(s.seatArea)) {
      if (s.viaTransfer) premXfer[f]++;
      else premOwn[f]++;
    }
  }

  // ---- groups: organizer and known attendees each count one outing and one game ----
  for (const g of world.groups) {
    const named = [fanFor('groups', `${g.bookingId}:organizer`)];
    for (let a = 0; a < g.knownAttendees.length; a++) named.push(fanFor('groups', `${g.bookingId}:attendee:${a}`));
    spend[named[0] * NS + si(g.season)] += g.amount;
    for (const f of named) {
      const k = f * NS + si(g.season);
      sysG[f] = 1;
      outings[f]++;
      games[k]++;
      active[k] = 1;
      if (PREMIUM.has(g.seatArea)) premGroup[f]++;
    }
  }

  // ---- F&B and retail ----
  const fnbByKey = new Map();
  for (const t of world.fnbIdentified) {
    const key = contactKey(t);
    let f = fnbByKey.get(key);
    if (f === undefined) { f = fanFor('fnb', t.txnId); fnbByKey.set(key, f); }
    const k = f * NS + si(t.season);
    sysF[f] = 1;
    fnb[k] += t.amount;
    spend[k] += t.amount;
    active[k] = 1;
    if (t.venue === 'team_store' || t.venue === 'mobile') retail[k] = 1;
  }

  // ---- experiences (part of the Groups & Experiences system), surveys, Kids Club ----
  for (const e of world.experiences) {
    const f = fanFor('experiences', e.expId);
    const k = f * NS + si(e.season);
    sysG[f] = 1;
    spend[k] += e.amount;
    active[k] = 1;
  }
  for (const s of world.surveys) {
    const f = fanFor('surveys', s.respId);
    if (s.season >= surveySeason[f]) { surveySat[f] = s.satisfaction; surveySeason[f] = s.season; }
  }
  const kcByKey = new Map();
  for (const r of world.kidsClub) {
    const key = contactKey(r.parent);
    let f = kcByKey.get(key);
    if (f === undefined) { f = fanFor('kidsClub', r.kcId); kcByKey.set(key, f); }
    kids[f].push({ kcId: r.kcId, joinDate: r.joinDate });
  }

  // ---- consent and do-not-contact, matched on normalized contacts ----
  const fanByEmail = new Map();
  const fanByPhone = new Map();
  clusters.forEach((c, i) => {
    for (const e of c.emails) fanByEmail.set(e, i);
    for (const p of c.phones) fanByPhone.set(p, i);
  });
  for (const r of world.consent) {
    const f = r.channel === 'sms' ? fanByPhone.get(normPhone(r.contact)) : fanByEmail.get(normEmail(r.contact));
    if (f === undefined) continue;
    const cur = consentDetail[f][r.channel];
    if (!cur || CONSENT_RANK[r.status] > CONSENT_RANK[cur.status]) {
      consentDetail[f][r.channel] = { status: r.status, source: r.source, date: r.date };
    }
  }
  for (const d of world.dnc) {
    const f = fanByEmail.has(normEmail(d)) ? fanByEmail.get(normEmail(d)) : fanByPhone.get(normPhone(d));
    if (f !== undefined) dnc[f] = 1;
  }

  // ---- assemble ----
  const fans = clusters.map((c, i) => {
    const plans = bySeason(plan, i, (v) => planNames[v]);
    const g = bySeason(games, i);
    let activeN = 0, total = 0;
    for (let s = 0; s < NS; s++) if (active[i * NS + s]) { activeN++; total += spend[i * NS + s]; }
    const cd = consentDetail[i];
    return {
      fanId: c.clusterId, name: c.name, zip: c.zip, region: regionForZip(c.zip),
      isMinor: c.nodes.some((n) => n.isMinor), heroId: (c.nodes.find((n) => n.heroId) || {}).heroId || null,
      plans, games: g, ticketGames: bySeason(ticketGames, i),
      attendanceChangePct: g[2025] > 0 ? Math.round(((g[2026] - g[2025]) / g[2025]) * 100) : null,
      transfersSent: bySeason(xfer, i), fnbSpend: bySeason(fnb, i), fnbPercentile2026: null,
      retailOrApp: bySeason(retail, i, (v) => v === 1),
      seasonsActive: activeN, groupOutings: outings[i],
      ownTicketEver: SEASONS.some((yr) => plans[yr] !== 'none'),
      singleGameBefore2026: plans[2024] === 'single' || plans[2025] === 'single',
      premium: { own: premOwn[i], viaTransfer: premXfer[i], viaGroup: premGroup[i] },
      surveySat: surveySat[i], kidsClubChildren: kids[i],
      consent: { email: cd.email ? cd.email.status : 'none', sms: cd.sms ? cd.sms.status : 'none', push: cd.push ? cd.push.status : 'none' },
      consentDetail: cd, dnc: dnc[i] === 1,
      systems: sysT[i] + sysF[i] + sysG[i],
      annualValue: activeN ? total / activeN : 0,
      nodes: c.nodes, evidence: c.evidence, confidence: c.confidence, emails: c.emails, phones: c.phones,
    };
  });

  // Percentile rank among fans with any 2026 F&B: share of other spenders below this fan, 0–100 (ties share a rank).
  const spenders = fans.filter((f) => f.fnbSpend[2026] > 0).sort((a, b) => a.fnbSpend[2026] - b.fnbSpend[2026]);
  const n = spenders.length;
  for (let i = 0; i < n;) {
    let j = i;
    while (j + 1 < n && spenders[j + 1].fnbSpend[2026] === spenders[i].fnbSpend[2026]) j++;
    const pct = n === 1 ? 100 : Math.round((i / (n - 1)) * 100);
    for (let k = i; k <= j; k++) spenders[k].fnbPercentile2026 = pct;
    i = j + 1;
  }
  return fans;
}

module.exports = { buildFans, regionForZip, normEmail, normPhone, contactKey };

"format.js": function (module, exports, require) {
// Display formatters. All person-level counts shown in the UI pass through here.
const { SCALE } = require('./config');

function scaled(raw) {
  return raw * SCALE;
}

// Round half up to `d` decimals, avoiding binary drift on exact ties.
function roundTo(v, d) {
  const f = Math.pow(10, d);
  return Math.round(Math.round(v * f * 1e6) / 1e6) / f;
}

// 3 significant figures for a value already divided into its unit (1 <= v < 1000).
// Decimals are recomputed after rounding so 9.995 -> "10.0" and 99.95 -> "100".
function sig3(v) {
  const r = roundTo(v, v < 10 ? 2 : v < 100 ? 1 : 0);
  const d = r >= 100 ? 0 : r >= 10 ? 1 : 2;
  return { r, text: r.toFixed(d) };
}

function compact(n) {
  const sign = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (Math.round(a) < 1000) {
    const r = Math.round(a);
    return r === 0 ? '0' : sign + r;
  }
  if (a < 1e6) {
    const k = sig3(a / 1000);
    if (k.r < 1000) return sign + k.text + 'K';
  }
  if (a < 1e9) {
    const m = sig3(a / 1e6);
    if (m.r < 1000) return sign + m.text + 'M';
  }
  return sign + sig3(a / 1e9).text + 'B';
}

function fmtCount(n) {
  return compact(n);
}

function fmtMoney(dollars) {
  const s = compact(dollars);
  return s[0] === '-' ? '-$' + s.slice(1) : '$' + s;
}

function fmtPct(fraction, digits = 0) {
  const s = roundTo(fraction * 100, digits).toFixed(digits);
  return (Number(s) === 0 ? (0).toFixed(digits) : s) + '%';
}

function fmtMultiple(x) {
  return roundTo(x, 1).toFixed(1) + 'x';
}

// One formatter for every chart axis tick, tooltip and data label.
function fmtChartValue(value, unit) {
  if (unit === 'count') return fmtCount(value);
  if (unit === 'money') return fmtMoney(value);
  if (unit === 'pct') return fmtPct(value, Math.abs(value) > 0 && Math.abs(value) < 0.1 ? 1 : 0);
  if (unit === 'number') {
    const r = roundTo(value, 1);
    return r === 0 ? '0' : Number.isInteger(r) ? String(r) : r.toFixed(1);
  }
  throw new Error(`Unknown chart unit ${unit}`);
}

function unitFor(top) {
  const exp = top > 0 ? Math.floor(Math.log10(top)) : 0;
  return Math.max(1, Math.pow(10, exp - 2));
}

function roundParts(parts) {
  const sum = parts.reduce((a, b) => a + b, 0);
  let unit = unitFor(Math.max(0, ...parts, sum));
  let rounded = parts.map((p) => Math.round(p / unit) * unit);
  let total = rounded.reduce((a, b) => a + b, 0);
  // Rounding can push the total into the next magnitude; re-derive the unit so
  // the total never shows more than 3 significant figures.
  const finer = unitFor(total);
  if (finer > unit) {
    unit = finer;
    rounded = parts.map((p) => Math.round(p / unit) * unit);
    total = rounded.reduce((a, b) => a + b, 0);
  }
  // One display scale and one decimal count for every label and the total.
  const scale = total >= 1e9 ? 1e9 : total >= 1e6 ? 1e6 : total >= 1000 ? 1000 : 1;
  const suffix = { 1: '', 1000: 'K', 1e6: 'M', 1e9: 'B' }[scale];
  let decimals = Math.max(0, Math.round(Math.log10(scale / unit)));
  // Drop trailing decimal columns that are zero for every value.
  while (decimals > 0) {
    const step = scale / Math.pow(10, decimals - 1);
    if ([...rounded, total].every((v) => v % step === 0)) decimals -= 1;
    else break;
  }
  const label = (v) => (v === 0 ? '0' : (v / scale).toFixed(decimals) + suffix);
  return { unit, parts: rounded, total, labels: rounded.map(label), totalLabel: label(total) };
}

module.exports = { scaled, fmtCount, fmtMoney, fmtPct, fmtMultiple, fmtChartValue, roundParts };

        let dayType = 'weeknight';
        if (dow === 0 || dow === 6) dayType = 'weekend';
        else if (i === stand - 1 || rand() < 0.15) dayType = 'day';
        const month = dt.getUTCMonth();
        const monthW = [1, 1, 1, 0.82, 0.95, 1.1, 1.15, 1.05, 0.9, 0.85][month] || 1;
        const typeW = dayType === 'weekend' ? 1.35 : dayType === 'day' ? 0.85 : 0.92;
        list.push({
          gameId: `${yr}-${pad(list.length + 1, 3)}`, season: yr, date: isoDate(d), dayType,
          w: typeW * monthW * (list.length === 0 ? 1.6 : 1),
        });
        d += DAY;
      }
      const gaps = stands.length - 1;
      if (si < gaps) d += DAY * (Math.floor(away * (si + 1) / gaps) - Math.floor(away * si / gaps));
    });
    let c = 0;
    const cum = list.map((g) => (c += g.w));
    bySeason[yr] = { list, cum, total: c };
    games.push(...list);
  }
  return { games, bySeason };
}

// k distinct games from a season, weighted by game popularity.
function sampleGames(rand, S, k) {
  const n = S.list.length;
  if (k >= n) return S.list.slice();
  const mark = new Uint8Array(n);
  let got = 0;
  while (got < k) {
    const x = rand() * S.total;
    let lo = 0;
    let hi = n - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (S.cum[mid] > x) hi = mid; else lo = mid + 1;
    }
    if (!mark[lo]) { mark[lo] = 1; got++; }
  }
  const out = [];
  for (let i = 0; i < n; i++) if (mark[i]) out.push(S.list[i]);
  return out;
}

// ---------- people ----------
function makePeople(rand, size) {
  const people = [];
  const st = [];
  const usedEmails = new Set();
  const usedPhones = new Set();
  const usedNameZip = new Set();
  const archs = Object.keys(TUNE.archetypes);
  const archW = archs.map((a) => TUNE.archetypes[a]);
  const lastCum = cumulative(LAST.map((_, i) => 1 / Math.sqrt(i + 3)));
  const zipPools = {};
  for (const r of REGIONS) {
    const zips = [];
    const w = [];
    for (const [a, b, wt] of ZIP_RANGES[r]) for (let z = a; z <= b; z++) { zips.push(pad(z, 5)); w.push(wt); }
    zipPools[r] = { zips, cum: cumulative(w) };
  }
  for (const h of Object.values(HEROES)) {
    h.emails.forEach((e) => usedEmails.add(e));
    h.phones.forEach((p) => usedPhones.add(p));
  }

  function makePhone(region) {
    for (;;) {
      const area = AREA_CODES[region][Math.floor(rand() * AREA_CODES[region].length)];
      intBetween(rand, 201, 989); // keeps the random stream aligned with earlier output
      const p = `${area}-555-${pad(intBetween(rand, 0, 9999), 4)}`;
      if (!usedPhones.has(p)) { usedPhones.add(p); return p; }
    }
  }
  function makeEmail(first, last, work) {
    const f = first.toLowerCase();
    const l = last.toLowerCase();
    const dom = work ? WORK_DOMAINS[Math.floor(rand() * WORK_DOMAINS.length)] : cumPick(rand, PERSONAL_DOMAINS, PERSONAL_CUM);
    const styles = work ? [`${f}.${l}`, `${f[0]}${l}`, `${f}${l[0]}`]
      : [`${f}.${l}`, `${f}${l}`, `${f[0]}${l}`, `${f}.${l}${intBetween(rand, 1, 99)}`, `${l}${f[0]}${intBetween(rand, 60, 99)}`, `${f}_${l}`];
    let base = styles[Math.floor(rand() * styles.length)];
    for (let n = 2; ; n++) {
      const e = `${base}@${dom}`;
      if (!usedEmails.has(e)) { usedEmails.add(e); return e; }
      base = `${styles[0]}${n}`;
    }
  }

  let hh = 0;
  while (people.length < size) {
    hh++;
    const region = pick(rand, REGIONS, REGIONS.map((r) => REGION_W[r]));
    const zp = zipPools[region];
    const zip = cumPick(rand, zp.zips, zp.cum);
    const last = cumPick(rand, LAST, lastCum);
    const hsize = Math.min(size - people.length, pick(rand, [1, 2, 3, 4], [0.5, 0.32, 0.12, 0.06]));
    const initials = new Set();
    const headIdx = people.length;
    for (let i = 0; i < hsize; i++) {
      const teen = i >= 2 && rand() < TUNE.teenRate;
      const gender = i === 0 ? (rand() < 0.5 ? 'm' : 'f') : i === 1 ? (people[headIdx].gender === 'm' ? 'f' : 'm') : (rand() < 0.5 ? 'm' : 'f');
      const pool = gender === 'm' ? MALE : FEMALE;
      let first;
      for (let t = 0; t < 50; t++) {
        first = pool[Math.floor(rand() * pool.length)];
        if (!initials.has(first[0]) && !usedNameZip.has(`${first}|${last}|${zip}`)) break;
      }
      initials.add(first[0]);
      usedNameZip.add(`${first}|${last}|${zip}`);
      let archetype;
      let role = null;
      if (teen) { archetype = 'casual'; role = 'minor'; }
      else if (i > 0 && people[headIdx].archetype === 'member' && rand() < 0.55) { archetype = 'casual'; role = 'recipient'; }
      else archetype = pick(rand, archs, archW);
      if (archetype === 'casual' && !role) role = rand() < 0.45 ? 'recipient' : 'one_game';
      const emails = [makeEmail(first, last, false)];
      if (!teen && rand() < 0.45) emails.push(makeEmail(first, last, rand() < 0.7));
      const phones = [];
      if (!teen || rand() < 0.5) phones.push(makePhone(region));
      if (!teen && rand() < 0.25) phones.push(makePhone(region));
      const pid = `P${pad(people.length + 1, 5)}`;
      people.push({
        pid, first, last, zip, region, emails, phones, householdId: `HH${pad(hh, 5)}`,
        isMinor: teen, archetype, heroId: null, gender,
      });
      st.push({ role, head: headIdx });
    }
    // A teen in the house means the head buys tickets and sends some to them.
    for (let i = headIdx + 2; i < people.length; i++) {
      if (people[i].isMinor && !['member', 'single', 'triple_play', 'family'].includes(people[headIdx].archetype)) {
        people[headIdx].archetype = pick(rand, ['member', 'single', 'triple_play'], [0.4, 0.3, 0.3]);
      }
    }
  }

  // Heroes replace single-person households at fixed slots so they flow through the same emitters.
  const hhSize = new Map();
  for (const p of people) hhSize.set(p.householdId, (hhSize.get(p.householdId) || 0) + 1);
  for (const [hid, spec] of Object.entries(HEROES)) {
    let i = Math.min(HERO_SLOTS[hid], people.length - 1);
    while (i < people.length && hhSize.get(people[i].householdId) > 1) i++;
    if (i >= people.length) i = Math.min(HERO_SLOTS[hid], people.length - 1);
    const p = people[i];
    Object.assign(p, {
      first: spec.first, last: spec.last, zip: spec.zip, region: 'Home state', emails: spec.emails.slice(),
      phones: spec.phones.slice(), archetype: spec.archetype, heroId: hid, gender: spec.gender, isMinor: false,
    });
    st[i].role = null;
  }
  return { people, st, makeEmail };
}

// ---------- contact variants (messy copies per source) ----------
function makeVariantFactory(rand, people, makeEmail) {
  const cache = new Map(); // key -> per-person array
  const PHONE_FMT = {
    ticketing: (d) => `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`,
    fnb: (d) => d,
    groups: (d) => `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`,
    experiences: (d) => `+1 ${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6)}`,
    kidsClub: (d) => `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6)}`,
  };
  function typo(s) {
    const vowels = 'aeiou';
    const idx = [];
    for (let i = 1; i < s.length; i++) if (vowels.includes(s[i])) idx.push(i);
    if (idx.length === 0) return s + s[s.length - 1];
    const i = idx[Math.floor(rand() * idx.length)];
    const others = vowels.replace(s[i], '');
    return s.slice(0, i) + others[Math.floor(rand() * others.length)] + s.slice(i + 1);
  }
  function messName(p) {
    if (rand() >= TUNE.nameMess) return `${p.first} ${p.last}`;
    if (NICK[p.first] && rand() < 0.7) return `${NICK[p.first]} ${p.last}`;
    return rand() < 0.5 ? `${typo(p.first)} ${p.last}` : `${p.first} ${typo(p.last)}`;
  }
  // source: ticketing|fnb|groups|experiences|kidsClub; key distinguishes extra accounts.
  return function variant(i, source, key = source) {
    let byPerson = cache.get(key);
    if (!byPerson) { byPerson = new Array(people.length); cache.set(key, byPerson); }
    if (byPerson[i]) return byPerson[i];
    const p = people[i];
    const name = messName(p);
    let email = p.emails[0];
    const pSecond = TUNE.secondEmail[key] ?? TUNE.secondEmail[source] ?? 0.2;
    if (rand() < pSecond) {
      if (p.emails.length < 2 && key.startsWith('ticketing_dup')) p.emails.push(makeEmail(p.first, p.last, false));
      if (p.emails.length > 1) email = p.emails[1 + Math.floor(rand() * (p.emails.length - 1))];
    }
    if (rand() < 0.04) email = email[0].toUpperCase() + email.slice(1);
    let phone = p.phones[0] || null;
    const r = rand();
    if (r < TUNE.missingPhone) phone = null;
    else if (r < TUNE.missingPhone + TUNE.oldPhone && p.phones[1]) phone = p.phones[1];
    const fmt = PHONE_FMT[source] || PHONE_FMT.ticketing;
    const v = { name, email, phone: phone ? fmt(phone.replace(/\D/g, '')) : null, zip: p.zip };
    byPerson[i] = v;
    return v;
  };
}

// ---------- season plans ----------
function memberSpend(rand, plan, tier, premium) {
  const m = premium ? 1.8 : 1;
  if (plan === 'season_pre') return Math.round(intBetween(rand, 1800, 5600) * m);
  if (plan === 'choice') return Math.round(intBetween(rand, 6, 75) * 100 * (premium ? 1.3 : 1));
  if (plan === 'reserved') {
    const base = tier === 'full' ? intBetween(rand, 3600, 6800) : tier === 'half' ? intBetween(rand, 1900, 3400) : intBetween(rand, 750, 1400);
    return Math.round(base * m);
  }
  return Math.round(intBetween(rand, 450, 900) * m); // starter
}
const PASS_PRICE = { 2024: 179, 2025: 199, 2026: 229 };

function planPerson(rand, p, s) {
  const out = {};
  const a = p.archetype;
  const tr = TUNE.trend;
  const singleSeason = (yr, prob) => {
    if (rand() < prob * tr[yr]) {
      const g = pick(rand, [1, 2, 3, 4], [0.55, 0.27, 0.12, 0.06]);
      return { plan: 'single', own: g, spend: g * intBetween(rand, 28, 85) };
    }
    return null;
  };
  const triple = (yr) => {
    const bundles = rand() < 0.15 ? 2 : 1;
    const own = Math.max(1, bundles * 3 - (rand() < 0.3 ? 1 : 0));
    return { plan: 'triple_play', own, spend: bundles * intBetween(rand, 95, 150) };
  };
  if (a === 'member') {
    s.premiumOwn = rand() < 0.2;
    s.seat = s.premiumOwn ? pick(rand, OWNED_PREMIUM, [3, 2, 2, 1]) : pick(rand, GENERAL_AREAS, [3, 3, 2, 1]);
    const tierPlan = pick(rand, MEMBER_PLANS, [0.35, 0.45, 0.2]);
    const resTier = pick(rand, ['full', 'half', 'twenty'], [0.35, 0.35, 0.3]);
    const base = tierPlan === 'reserved' ? (resTier === 'full' ? intBetween(rand, 36, 58) : resTier === 'half' ? intBetween(rand, 20, 34) : intBetween(rand, 12, 18))
      : tierPlan === 'choice' ? intBetween(rand, 14, 32) : intBetween(rand, 8, 16);
    const churn = rand() < 0.08; // left after 2025
    const leftEarly = !churn && rand() < 0.12; // held a 2024 season ticket, never joined the membership program
    s.slipping = !churn && !leftEarly && rand() < 0.27;
    const mg = TUNE.memberGames;
    for (const yr of SEASONS) {
      if (yr === 2024) {
        if (rand() < 0.93) out[yr] = { plan: 'season_pre', own: Math.round(base * mg[yr] * (0.85 + rand() * 0.3)), spend: memberSpend(rand, 'season_pre', null, s.premiumOwn) };
        else out[yr] = singleSeason(yr, 1);
      } else if (leftEarly || (yr === 2026 && churn)) {
        out[yr] = singleSeason(yr, 0.5);
      } else {
        let own = Math.round(base * mg[yr] * (0.85 + rand() * 0.3));
        if (yr === 2026 && s.slipping) own = Math.max(1, Math.round(own * (0.15 + rand() * 0.4)));
        out[yr] = { plan: tierPlan, own, spend: memberSpend(rand, tierPlan, resTier, s.premiumOwn) };
      }
      const o = out[yr];
      if (o && o.plan !== 'single') {
        o.xfer = yr === 2026 && s.slipping ? intBetween(rand, 6, 16) : intBetween(rand, 1, 8);
        o.seat = s.seat;
      }
    }
  } else if (a === 'pass') {
    s.power = rand() < 0.42;
    out[2026] = { plan: 'ballpark_pass', own: s.power ? intBetween(rand, 20, 38) : intBetween(rand, 3, 15), spend: PASS_PRICE[2026] };
    out[2025] = pick(rand, ['pass', 'single', 'none'], [0.6, 0.25, 0.15]);
    out[2024] = pick(rand, ['pass', 'single', 'triple', 'none'], [0.5, 0.3, 0.1, 0.1]);
    for (const yr of [2024, 2025]) {
      const k = out[yr];
      out[yr] = k === 'pass' ? { plan: 'ballpark_pass', own: intBetween(rand, 8, yr === 2024 ? 34 : 28), spend: PASS_PRICE[yr] }
        : k === 'single' ? singleSeason(yr, 1) : k === 'triple' ? triple(yr) : null;
    }
  } else if (a === 'triple_play') {
    for (const yr of SEASONS) out[yr] = rand() < 0.78 * tr[yr] ? triple(yr) : singleSeason(yr, 0.5);
  } else if (a === 'single') {
    for (const yr of SEASONS) out[yr] = singleSeason(yr, 0.62);
    if (!SEASONS.some((yr) => out[yr])) out[2024] = singleSeason(2024, 2);
  } else if (a === 'lapsed_single') {
    out[2024] = singleSeason(2024, 0.75);
    out[2025] = singleSeason(2025, out[2024] ? 0.5 : 2);
    out[2026] = null;
  } else if (a === 'family') {
    for (const yr of SEASONS) out[yr] = rand() < 0.4 ? triple(yr) : singleSeason(yr, 0.7);
    if (!out[2026] || rand() < 0.15) out[2026] = rand() < 0.5 ? triple(2026) : singleSeason(2026, 2);
  } else if (a === 'premium_curious') {
    for (const yr of SEASONS) out[yr] = rand() < 0.4 ? triple(yr) : singleSeason(yr, yr === 2026 ? 0.9 : 0.6);
  } else if (a === 'casual' && s.role === 'one_game') {
    const yr = pick(rand, SEASONS, [1.4, 1, 0.75]);
    out[yr] = { plan: 'single', own: 1, spend: intBetween(rand, 25, 70) };
  }
  return out;
}
