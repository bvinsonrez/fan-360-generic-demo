      if (first.has(v)) {
        const f = first.get(v);
        const dupOfEmail = method === 'phone' && nodes[f].email && nodes[f].email === nodes[i].email;
        if (!dupOfEmail) byMethod[method]++;
        link(f, i, method);
      }
      else first.set(v, i);
    }
  }

  // fuzzy within blocking key; same last+zip failing the test becomes a low candidate
  const blocks = new Map();
  const lastZip = new Map();
  for (let i = 0; i < n; i++) {
    const x = nodes[i];
    if (!x.zip || !x.last || !x.first) continue;
    const cf = canonFirst(x.first);
    x.cf = cf;
    const bk = `${x.zip}|${soundex(x.last)}|${cf[0]}`;
    if (!blocks.has(bk)) blocks.set(bk, []);
    blocks.get(bk).push(i);
    const lz = `${x.zip}|${x.last}`;
    if (!lastZip.has(lz)) lastZip.set(lz, []);
    lastZip.get(lz).push(i);
  }
  for (const list of blocks.values()) {
    for (let a = 0; a < list.length; a++) {
      for (let b = a + 1; b < list.length; b++) {
        const x = nodes[list[a]], y = nodes[list[b]];
        if (find(list[a]) === find(list[b])) continue;
        if (x.cf === y.cf || jaroWinkler(x.first, y.first) >= 0.92) { byMethod.fuzzy++; link(list[a], list[b], 'fuzzy'); }
      }
    }
  }
  const lowPairs = [];
  for (const list of lastZip.values()) {
    for (let a = 0; a < list.length; a++) {
      for (let b = a + 1; b < list.length; b++) {
        if (find(list[a]) === find(list[b])) continue;
        const x = nodes[list[a]], y = nodes[list[b]];
        if (x.first[0] === y.first[0] || x.cf[0] === y.cf[0] || jaroWinkler(x.first, y.first) >= 0.8) lowPairs.push([list[a], list[b]]);
      }
    }
  }

  // ---- assemble clusters ----
  const groupsByRoot = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(i);
    if (!groupsByRoot.has(r)) groupsByRoot.set(r, []);
    groupsByRoot.get(r).push(i);
  }
  const clusterIdx = new Map();
  const clusters = [];
  for (const [root, members] of groupsByRoot) {
    const emails = new Set(), phones = new Set();
    const nameCount = new Map(), zipCount = new Map();
    for (const i of members) {
      const x = nodes[i];
      if (x.email) emails.add(x.email);
      if (x.phone) phones.add(x.phone);
      if (x.name) nameCount.set(x.name, (nameCount.get(x.name) || 0) + 1);
      if (x.zip) zipCount.set(x.zip, (zipCount.get(x.zip) || 0) + 1);
    }
    const top = (m) => { let best = '', bc = 0; for (const [k, c] of m) if (c > bc) { best = k; bc = c; } return best; };
    const c = {
      clusterId: `C${String(clusters.length + 1).padStart(6, '0')}`,
      nodes: members.map((i) => ({ source: nodes[i].source, id: nodes[i].id, isMinor: nodes[i].isMinor, heroId: nodes[i].heroId })),
      emails: [...emails], phones: [...phones],
      name: top(nameCount), zip: top(zipCount),
      confidence: 'high', evidence: [], lowCandidates: [],
    };
    clusterIdx.set(root, c);
    clusters.push(c);
  }
  for (const [a, b, method] of mergeEdges) {
    const c = clusterIdx.get(find(a));
    c.evidence.push({ a: nodes[a].id, b: nodes[b].id, method });
    if (method === 'fuzzy') c.confidence = 'medium';
  }
  for (const [a, b] of lowPairs) {
    const ref = (i) => ({ source: nodes[i].source, id: nodes[i].id });
    clusterIdx.get(find(a)).lowCandidates.push({ nodeA: ref(a), nodeB: ref(b) });
  }

  const byConfidence = { high: byMethod.email + byMethod.phone, medium: byMethod.fuzzy, low: lowPairs.length };
  const candidateMatches = byConfidence.high + byConfidence.medium + byConfidence.low;
  return {
    clusters,
    stats: {
      sourceRecords: n, candidateMatches, resolvedFans: clusters.length,
      byMethod, byConfidence, lowUnmerged: lowPairs.length,
    },
  };
}

module.exports = { resolveIdentities, soundex, jaroWinkler };

},
"model.js": function (module, exports, require) {
// Single entry point used by the UI and tests: world → linkage → fans → view models.
const config = require('./config');
const { generateWorld } = require('./generate');
const { resolveIdentities } = require('./linkage');
const { buildFans } = require('./fans');
const { ticketingView, fnbView, groupsView } = require('./views-systems');
const { fan360View } = require('./views-fan360');
const { computeRecommendations } = require('./recommendations');

function buildModel(cfg = config) {
  const world = generateWorld({ seed: cfg.SEED, size: cfg.SAMPLE_SIZE });
  const linkage = resolveIdentities(world);
  const fans = buildFans(world, linkage);
  const fanById = new Map(fans.map((f) => [f.fanId, f]));
  const views = {
    ticketing: ticketingView(world),
    fnb: fnbView(world),
    groups: groupsView(world),
    fan360: fan360View(world, linkage, fans),
  };
  return { world, linkage, fans, fanById, views, recommendations: computeRecommendations(fans) };
}

module.exports = { buildModel };

},
"recommendations.js": function (module, exports, require) {
// Tab 7: pattern-detection rules expressed as tab 6 filter specs, scored into ranked cards.
const { applyFilters, consentWaterfall } = require('./segments');
const { scaled, fmtCount, fmtPct } = require('./format');

const RANKING_NOTE = 'Ranked by projected incremental 2027 ticket and F&B revenue from the eligible audience.';

const RULES = [
  {
    id: 'pass_power', name: 'Ballpark Pass power users',
    ruleText: 'Ballpark Pass holders in 2026 who attended 20 or more games and sit in the top half of F&B spend.',
    filters: { plan2026: ['ballpark_pass'], games2026Min: 20, fnbPercentile2026Min: 50 },
    conversionRate: 0.08, valuePerConversion: 640,
    valueAssumption: 'Assumes 8% take the 2027 Member Starter offer, worth about $640 each in added ticket and F&B revenue over a Ballpark Pass.',
    whyNow: 'Offer a 2027 Member Starter upgrade before Ballpark Pass goes on sale in February.',
    heroId: 'H1',
  },
  {
    id: 'slipping_members', name: 'Slipping Members',
    ruleText: 'Members (Choice, Reserved, Starter) whose 2026 attendance fell 40% or more and who kept transferring tickets.',
    filters: { plan2026: ['choice', 'reserved', 'starter'], attendanceChangeMaxPct: -40, keptTransferring2026: true },
    conversionRate: 0.18, valuePerConversion: 1450,
    valueAssumption: 'Assumes 18% renew in the 2027 window after a save offer, worth about $1,450 each in ticket and F&B revenue that would otherwise lapse.',
    whyNow: 'The 2027 membership renewal window is open and member benefit credits can anchor the save offer.',
    heroId: 'H2',
  },
  {
    id: 'group_only', name: 'Group-only buyers',
    ruleText: 'Fans with two or more group outings who have never owned a ticket of their own.',
    filters: { groupOutingsMin: 2, neverOwnTicket: true },
    conversionRate: 0.07, valuePerConversion: 380,
    valueAssumption: 'Assumes 7% buy a first Triple Play Bundle, worth about $380 each in ticket and F&B revenue.',
    whyNow: 'Fan Fest in January is the first in-person moment to offer the Triple Play Bundle.',
    heroId: 'H3',
  },
  {
    id: 'lapsed_single_merch', name: 'Lapsed single-game buyers who still shop',
    ruleText: 'Bought single games before 2026, hold no plan in 2026, and bought from the Team Store or team app in 2026.',
    filters: { singleGameBefore2026: true, plan2026: ['none'], retailOrApp2026: true },
    conversionRate: 0.06, valuePerConversion: 210,
    valueAssumption: 'Assumes 6% return for a single game in 2027, worth about $210 each including F&B.',
    whyNow: 'November offseason: Team Store and app engagement is the only live signal, so a win-back note lands before holiday gifting.',
    heroId: null,
  },
  {
    id: 'kids_families', name: 'Kids Club families without a plan',
    ruleText: 'Households with a Kids Club child that bought only single games or a Triple Play Bundle in 2026. Parents only.',
    filters: { kidsClubHousehold: true, plan2026: ['single', 'triple_play'] },
    conversionRate: 0.08, valuePerConversion: 520,
    valueAssumption: 'Assumes 8% of parents take a family plan for 2027, worth about $520 each in ticket and F&B revenue. Children are never contacted.',
    whyNow: 'Fan Fest in January brings Kids Club families in person, and Ballpark Pass goes on sale in February.',
    heroId: 'H4',
  },
  {
    id: 'premium_curious', name: 'Premium-curious fans',
    ruleText: 'Fans who have never owned premium seats but reached premium areas by transfer or group, and rank in the top quarter of F&B spend.',
    filters: { excludePremiumOwn: true, premiumViaTransferOrGroup: true, fnbPercentile2026Min: 75 },
    conversionRate: 0.04, valuePerConversion: 1180,
    valueAssumption: 'Assumes 4% buy a Home Plate Club or Dugout Club seat for 2027, worth about $1,180 each in ticket and F&B revenue.',
    whyNow: 'The 2027 membership renewal window is the moment to show a premium seat alongside the renewal.',
    heroId: null,
    sponsor: { label: 'Sponsor-ready audience (aggregate only, no fan data shared)' },
  },
];

const avg = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);
const share = (xs, p) => (xs.length ? xs.filter(p).length / xs.length : 0);
const ordinal = (n) => {
  const t = n % 100;
  const suffix = t >= 11 && t <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
  return n + suffix;
};
const round1 = (v) => Math.round(v * 10) / 10;

// Each evidence compares the segment with everyone in the relevant baseline; per-person values are not scaled.
const EVIDENCE = {
  pass_power(seg, all) {
    const base = all.filter((f) => f.plans[2026] === 'ballpark_pass');
    const s = avg(seg.map((f) => f.games[2026])), b = avg(base.map((f) => f.games[2026]));
    return { label: 'Average 2026 games attended (vs all Ballpark Pass holders)', baselineLabel: 'All Ballpark Pass holders', unit: 'number', s, b, fmt: (v) => `${round1(v).toFixed(1)} games` };
  },
  slipping_members(seg, all) {
    const base = all.filter((f) => ['choice', 'reserved', 'starter'].includes(f.plans[2026]) && f.attendanceChangePct !== null);
    const s = avg(seg.map((f) => f.attendanceChangePct)), b = avg(base.map((f) => f.attendanceChangePct));
    return { label: 'Average change in attendance, 2025 to 2026 (vs all Members)', baselineLabel: 'All Members', unit: 'pct', scale: 0.01, s, b, fmt: (v) => fmtPct(v / 100) };
  },
  group_only(seg, all) {
    const s = avg(seg.map((f) => f.groupOutings)), b = avg(all.filter((f) => f.groupOutings > 0).map((f) => f.groupOutings));
    return { label: 'Average group outings (vs all fans with a group outing)', baselineLabel: 'All fans with a group outing', unit: 'number', s, b, fmt: (v) => round1(v).toFixed(1) };
  },
  lapsed_single_merch(seg, all) {
    const base = all.filter((f) => f.singleGameBefore2026);
    const past = (f) => f.games[2024] + f.games[2025];
    const s = avg(seg.map(past)), b = avg(base.map(past));
    return { label: 'Average games attended in 2024 and 2025 (vs all 2024-25 single-game buyers)', baselineLabel: 'All 2024-25 single-game buyers', unit: 'number', s, b, fmt: (v) => `${round1(v).toFixed(1)} games` };
  },
  kids_families(seg, all) {
    const tp = (f) => f.plans[2026] === 'triple_play';
    const buyers = all.filter((f) => f.plans[2026] === 'single' || f.plans[2026] === 'triple_play');
    const s = share(seg, tp), b = share(buyers, tp);
    return { label: 'Share who bought a Triple Play Bundle in 2026 (vs all 2026 single-game and Triple Play buyers)', baselineLabel: 'All 2026 single-game and Triple Play buyers', unit: 'pct', s, b, fmt: (v) => fmtPct(v) };
  },
  premium_curious(seg, all) {
    const spenders = all.filter((f) => f.fnbPercentile2026 !== null);
    const s = avg(seg.map((f) => f.fnbPercentile2026)), b = avg(spenders.map((f) => f.fnbPercentile2026));
    return { label: 'Average F&B spend percentile, 2026 (vs all F&B buyers)', baselineLabel: 'All F&B buyers', unit: 'number', s, b, fmt: (v) => ordinal(Math.round(v)) + ' percentile' };
  },
};

function computeRecommendations(fans) {
  const cards = RULES.map((r) => {
    const seg = applyFilters(fans, r.filters);
    const eligible = consentWaterfall(seg, 'email').eligible;
    const e = EVIDENCE[r.id](seg, fans);
    return {
      id: r.id, name: r.name, ruleText: r.ruleText, filters: { ...r.filters },
      matched: seg.length, eligible,
      projectedValue: scaled(eligible) * r.conversionRate * r.valuePerConversion,
      valueAssumption: r.valueAssumption,
      evidence: {
        label: e.label, baselineLabel: e.baselineLabel, segmentValue: e.fmt(e.s), baselineValue: e.fmt(e.b),
        chart: { labels: ['This segment', e.baselineLabel], series: [[Math.round(e.s * (e.scale || 1) * 1e4) / 1e4, Math.round(e.b * (e.scale || 1) * 1e4) / 1e4]], unit: e.unit },
      },
      whyNow: r.whyNow, heroId: r.heroId,
      sponsorAudience: r.sponsor ? r.sponsor.label : null,
      sponsorAudienceSize: r.sponsor ? `${r.sponsor.label}: ${fmtCount(scaled(seg.length))} fans` : null,
      expanded: false,
    };
  });
  cards.sort((a, b) => b.projectedValue - a.projectedValue);
  cards[0].expanded = true;
  return cards;
}

module.exports = { RULES, RANKING_NOTE, computeRecommendations };

},
"rng.js": function (module, exports, require) {
// Deterministic seeded PRNG helpers.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Weighted pick. Falls back to the last positively weighted item on float drift.
function pick(rand, items, weights) {
  let total = 0;
  for (const w of weights) total += w;
  let x = rand() * total;
  let last = items.length - 1;
  for (let i = 0; i < items.length; i++) {
    if (weights[i] > 0) last = i;
    x -= weights[i];
    if (x < 0 && weights[i] > 0) return items[i];
  }
  return items[last];
}

// Inclusive integer in [lo, hi].
function intBetween(rand, lo, hi) {
  return lo + Math.floor(rand() * (hi - lo + 1));
}

module.exports = { mulberry32, pick, intBetween };

},
"segments.js": function (module, exports, require) {
// Tab 6: segment filters, consent waterfall, channel projections and builder state.
const { CHANNELS, SCALE } = require('./config');
const { roundParts, scaled, fmtCount, fmtMoney, fmtPct } = require('./format');

const DEFAULT_FILTERS = {
  plan2026: [], seasonsActiveMin: 0, games2026Min: null, games2026Max: null,
  attendanceChangeMaxPct: null, fnbPercentile2026Min: null, keptTransferring2026: false,
  retailOrApp2026: false, groupOutingsMin: 0, neverOwnTicket: false, singleGameBefore2026: false,
  premiumViaTransferOrGroup: false, excludePremiumOwn: false, surveySatMax: null,
  kidsClubHousehold: false, regions: [],
};

const has = (v) => v !== null && v !== undefined;

function applyFilters(fans, filters) {
  const f = { ...DEFAULT_FILTERS, ...filters };
  return fans.filter((x) => {
    if (f.plan2026.length && !f.plan2026.includes(x.plans[2026])) return false;
    if (f.seasonsActiveMin > 0 && x.seasonsActive < f.seasonsActiveMin) return false;
    if (has(f.games2026Min) && x.games[2026] < f.games2026Min) return false;
    if (has(f.games2026Max) && x.games[2026] > f.games2026Max) return false;
    if (has(f.attendanceChangeMaxPct) && !(x.attendanceChangePct !== null && x.attendanceChangePct <= f.attendanceChangeMaxPct)) return false;
    if (has(f.fnbPercentile2026Min) && !(x.fnbPercentile2026 !== null && x.fnbPercentile2026 >= f.fnbPercentile2026Min)) return false;
    if (f.keptTransferring2026 && !(x.transfersSent[2026] > 0)) return false;
    if (f.retailOrApp2026 && !x.retailOrApp[2026]) return false;
    if (f.groupOutingsMin > 0 && x.groupOutings < f.groupOutingsMin) return false;
    if (f.neverOwnTicket && x.ownTicketEver) return false;
    if (f.singleGameBefore2026 && !x.singleGameBefore2026) return false;
    if (f.premiumViaTransferOrGroup && !(x.premium.viaTransfer + x.premium.viaGroup > 0)) return false;
    if (f.excludePremiumOwn && x.premium.own !== 0) return false;
    if (has(f.surveySatMax) && !(x.surveySat !== null && x.surveySat <= f.surveySatMax)) return false;
    if (f.kidsClubHousehold && !(x.kidsClubChildren.length > 0)) return false;
    if (f.regions.length && !f.regions.includes(x.region)) return false;
    return true;
  });
}

const STEP_LABELS = {
  no_opt_in: 'No opt-in on record',
  opted_out: 'Opted out',
  dnc: 'Do-not-contact',
  minor: 'Minors (Kids Club children are never included)',
  duplicate: 'Duplicate contacts removed',
};

const channelById = (id) => {
  const c = CHANNELS.find((x) => x.id === id);
  if (!c) throw new Error(`Unknown channel ${id}`);
  return c;
};

// Contacts that identify a fan on a channel; push has no shared contact, so it never dedupes.
function channelContacts(fan, channelId) {
  if (channelId === 'sms') return fan.phones;
  if (channelId === 'push') return [];
  return fan.emails;
}

function consentWaterfall(fans, channelId) {
  const key = channelById(channelId).consentKey;
  const removed = { no_opt_in: 0, opted_out: 0, dnc: 0, minor: 0, duplicate: 0 };
  let remaining = [];
  for (const f of fans) {
    const c = f.consent[key];
    if (c === 'opt_out') removed.opted_out++;
    else if (c !== 'opt_in') removed.no_opt_in++;
    else remaining.push(f);
  }
  // Steps run in brief order on what remains: opt-in checks, then do-not-contact, minors, duplicates.
  const afterDnc = [];
  for (const f of remaining) { if (f.dnc) removed.dnc++; else afterDnc.push(f); }
  const afterMinor = [];
  for (const f of afterDnc) { if (f.isMinor) removed.minor++; else afterMinor.push(f); }
  const kept = new Set();
  let eligible = 0;
  for (const f of afterMinor.slice().sort((a, b) => (a.fanId < b.fanId ? -1 : a.fanId > b.fanId ? 1 : 0))) {
    const cs = channelContacts(f, channelId);
    if (cs.some((c) => kept.has(c))) { removed.duplicate++; continue; }
    for (const c of cs) kept.add(c);
    eligible++;
  }
  const steps = ['no_opt_in', 'opted_out', 'dnc', 'minor', 'duplicate']
    .map((id) => ({ id, label: STEP_LABELS[id], removed: removed[id] }));
  const display = roundParts([eligible, ...steps.map((s) => s.removed)].map((v) => v * SCALE));
  return { start: fans.length, eligible, steps, display };
}

const FUNNEL = {
  email: ['delivered', 'opened', 'clicked', 'purchased'],
  sms: ['delivered', 'opened', 'clicked', 'purchased'],
  push: ['delivered', 'opened', 'clicked', 'purchased'],
  social: ['matched', 'clicked', 'purchased'],
};

function projectResults(eligible, channelIds) {
  const perChannel = channelIds.map((id) => {
    const ch = channelById(id);
    const metrics = {};
    for (const step of FUNNEL[id]) metrics[step] = Math.round(eligible * ch.rates[step]);
    return { channelId: id, label: ch.label, metrics, revenue: metrics.purchased * ch.aov, rates: { ...ch.rates }, aov: ch.aov };
  });
  return {
    perChannel,
    combined: {
      purchases: perChannel.reduce((a, c) => a + c.metrics.purchased, 0),
      revenue: perChannel.reduce((a, c) => a + c.revenue, 0),
    },
  };
}

const STEP_ROW_LABELS = { delivered: 'Delivered', opened: 'Opened', clicked: 'Clicked', matched: 'Matched', purchased: 'Purchases' };

// Display strings for projectResults output; tab 6 renders exactly these.
function projectionDisplay(results) {
  const perChannel = results.perChannel.map((c) => ({
    channelId: c.channelId,
    label: c.label,
    rows: [
      ...Object.keys(c.metrics).map((k) => ({ label: STEP_ROW_LABELS[k], value: fmtCount(scaled(c.metrics[k])) })),
      { label: 'Projected revenue', value: fmtMoney(scaled(c.revenue)) },
    ],
  }));
  const combined = [
    { label: 'Combined purchases', value: fmtCount(scaled(results.combined.purchases)) },
    { label: 'Combined revenue', value: fmtMoney(scaled(results.combined.revenue)) },
  ];
  return { perChannel, combined };
}

// Stated assumptions for a channel, as shown under its projections on tab 6.
function assumptionText(ch) {
  const pct = (r) => fmtPct(r, Math.abs(r * 100 - Math.round(r * 100)) > 1e-9 ? 1 : 0);
  const rates = Object.keys(ch.rates).map((k) => `${STEP_ROW_LABELS[k]} ${pct(ch.rates[k])}`).join(', ');
  return `Assumptions, share of eligible fans: ${rates}, average order ${fmtMoney(ch.aov)}.`;
}

// Combined purchases and revenue across single-channel projectResults outputs, as display rows.
function combineProjections(results) {
  const per = results.map((r) => r.perChannel[0]);
  return projectionDisplay({
    perChannel: per,
    combined: {
      purchases: per.reduce((a, c) => a + c.metrics.purchased, 0),
      revenue: per.reduce((a, c) => a + c.revenue, 0),
    },
  }).combined;
}

function createSegmentState() {
  return { filters: { ...DEFAULT_FILTERS, plan2026: [], regions: [] }, channelIds: ['email'], fromRecommendation: null };
}

function applyRecommendation(state, rec) {
  return {
    ...state,
    filters: { ...DEFAULT_FILTERS, plan2026: [], regions: [], ...rec.filters },
    channelIds: ['email'],
    fromRecommendation: { id: rec.id, name: rec.name },
  };
}

function setFilter(state, key, value) {
  return { ...state, filters: { ...state.filters, [key]: value }, fromRecommendation: null };
}

module.exports = {
  DEFAULT_FILTERS, applyFilters, consentWaterfall, projectResults, projectionDisplay,
  createSegmentState, applyRecommendation, setFilter, STEP_ROW_LABELS,
  assumptionText, combineProjections,
};

},
"ui/charts.js": function (module, exports, require) {
// Chart.js wrappers. Every tick, tooltip and data label goes through fmtChartValue.
const { PALETTE } = require('../config');
const { fmtChartValue } = require('../format');

const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const LABEL_PX = 12;
// Color rules, in order:
// 1. Seasons are ordinal: a light-to-dark blue ramp, newest season darkest.
// 2. The accent marks the one thing the chart title asks you to notice; everything else
//    in that chart drops to grey so the accent is the only saturated mark.
// 3. Otherwise categories cycle from the primary blue through its tints and neutrals.
const SEASON_RAMP = ['#BFD3EA', '#5E93CF', PALETTE.primary];
const CONTEXT = [PALETTE.greyLight, PALETTE.grey, PALETTE.slate];
const CYCLE = [PALETTE.primary, PALETTE.grey, '#5E93CF', PALETTE.greyLight, '#BFD3EA', PALETTE.slate];
const EMPTY_TEXT = 'No fans match these filters';

const live = new Map();

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function destroyChart(container) {
  const c = live.get(container);
  if (c) { c.destroy(); live.delete(container); }
}

function destroyAllCharts() {
  for (const c of live.values()) c.destroy();
  live.clear();
}

function isAllZero(spec) {
  return spec.series.every((s) => s.data.every((v) => v === null || v === undefined || v === 0));
}

function seriesColors(spec) {
  if (spec.seasonSeries) {
    const off = SEASON_RAMP.length - spec.series.length;
    return spec.series.map((_, i) => SEASON_RAMP[Math.max(0, i + off)]);
  }
  let n = 0;
  if (spec.series.some((s) => s.highlight)) return spec.series.map((s) => (s.highlight ? PALETTE.accent : CONTEXT[n++ % CONTEXT.length]));
  return spec.series.map(() => CYCLE[n++ % CYCLE.length]);
}

// Text color for a label drawn on a filled shape: white only where it reads at 4.5:1.
function lum(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map((v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function labelOn(bg) { return 1.05 / (lum(bg) + 0.05) >= 4.5 ? PALETTE.white : PALETTE.ink; }

function isDonut(spec) { return spec.type === 'doughnut' || spec.type === 'donut'; }
function isHorizontal(spec) { return spec.type === 'hbar' || spec.indexAxis === 'y'; }

function buildDatasets(spec) {
  const colors = seriesColors(spec);
  const hi = spec.highlightIndex;
  if (isDonut(spec)) {
    const s = spec.series[0];
    const bg = s.data.map((_, i) => (i === hi ? PALETTE.accent : i === 0 && hi === undefined ? PALETTE.primary : PALETTE.grey));
    return [{ label: s.name, data: s.data, backgroundColor: bg, borderColor: PALETTE.white, borderWidth: 2 }];
  }
  return spec.series.map((s, si) => {
    const base = { label: s.name, data: s.data };
    if (spec.type === 'line') {
      const strong = s.highlight || (spec.seasonSeries && si === spec.series.length - 1) || spec.series.length === 1;
      return { ...base, borderColor: colors[si], backgroundColor: colors[si], borderWidth: strong ? 2.5 : 1.5,
        pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: false, yAxisID: s.axis || 'y' };
    }
    const bg = spec.series.length === 1 && hi !== undefined
      ? s.data.map((_, i) => (i === hi ? PALETTE.accent : PALETTE.grey))
      : colors[si];
    return { ...base, backgroundColor: bg, borderColor: PALETTE.white, borderWidth: spec.stacked ? 1 : 0, maxBarThickness: 56 };
  });
}

function axisTitleFont() { return { family: FONT, size: LABEL_PX }; }

function buildScales(spec) {
  if (isDonut(spec)) return {};
  const horizontal = isHorizontal(spec);
  const unit = spec.unit;
  const valueAxis = (extra) => ({
    beginAtZero: true,
    stacked: !!spec.stacked,
    grid: { color: PALETTE.greyLight },
    border: { display: false },
    ticks: { font: axisTitleFont(), color: PALETTE.slate, maxTicksLimit: 5, callback: (v) => fmtChartValue(v, unit) },
    ...extra,
  });
  const categoryAxis = {
    stacked: !!spec.stacked,
    grid: { display: false },
    ticks: { font: axisTitleFont(), color: PALETTE.slate, autoSkip: spec.type === 'line', maxTicksLimit: spec.type === 'line' ? 9 : 12, maxRotation: 0 },
  };
  const scales = horizontal ? { x: valueAxis({ position: 'bottom' }), y: categoryAxis } : { x: categoryAxis, y: valueAxis({ position: 'left' }) };
  if (spec.series.some((s) => s.axis === 'y2')) {
    scales.y2 = valueAxis({ position: 'right', grid: { drawOnChartArea: false } });
  }
  return scales;
}

// Draws value labels on small bar charts and donut slices, formatted by fmtChartValue.
function valueLabelPlugin(spec) {
  return {
    id: 'valueLabels',
    afterDatasetsDraw(chart) {
      const donut = isDonut(spec);
      // Label single-series bars and donuts only; multi-series charts read from the axis.
      if (spec.type === 'line' || spec.stacked || (!donut && spec.series.length > 1)) return;
      const ctx = chart.ctx;
      ctx.save();
      ctx.font = `600 ${LABEL_PX}px ${FONT}`;
      const horizontal = isHorizontal(spec);
      chart.data.datasets.forEach((ds, di) => {
        chart.getDatasetMeta(di).data.forEach((arc, i) => {
          const v = ds.data[i];
          if (v === null || v === undefined || v === 0) return;
          const text = fmtChartValue(v, spec.unit);
          if (donut) {
            ctx.fillStyle = labelOn(ds.backgroundColor[i]);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const p = arc.tooltipPosition();
            ctx.fillText(text, p.x, p.y);
          } else if (horizontal) {
            ctx.fillStyle = PALETTE.ink;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, arc.x + 4, arc.y);
          } else {
            ctx.fillStyle = PALETTE.ink;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(text, arc.x, arc.y - 2);
          }
        });
      });
      ctx.restore();
    },
  };
}

function renderChart(container, spec) {
  destroyChart(container);
  container.textContent = '';
  if (isAllZero(spec)) {
    container.appendChild(el('div', 'chart-empty', EMPTY_TEXT));
    return null;
  }
  if (typeof Chart === 'undefined') {
    container.appendChild(el('div', 'chart-empty', 'Chart library unavailable'));
    return null;
  }
  const canvas = el('canvas');
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', spec.title);
  container.appendChild(canvas);
  const donut = isDonut(spec);
  const horizontal = isHorizontal(spec);
  const showLegend = donut || spec.series.length > 1;
  const chart = new Chart(canvas, {
    type: donut ? 'doughnut' : spec.type === 'hbar' ? 'bar' : spec.type,
    data: { labels: spec.labels, datasets: buildDatasets(spec) },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      indexAxis: horizontal ? 'y' : 'x',
      layout: { padding: { top: 14, right: horizontal ? 36 : 4 } },
      interaction: spec.type === 'line' ? { mode: 'index', intersect: false } : undefined,
      scales: buildScales(spec),
      plugins: {
        legend: {
          display: showLegend,
          position: donut ? 'right' : 'bottom',
          labels: { font: { family: FONT, size: LABEL_PX }, color: PALETTE.ink, boxWidth: 12, boxHeight: 12 },
        },
        tooltip: {
          titleFont: { family: FONT, size: LABEL_PX },
          bodyFont: { family: FONT, size: LABEL_PX },
          callbacks: {
            label: (c) => `${donut ? c.label : c.dataset.label}: ${fmtChartValue(c.raw, spec.unit)}`,
          },
        },
      },
    },
    plugins: [valueLabelPlugin(spec)],
  });
  live.set(container, chart);
  return chart;
}

function renderKpis(container, kpis) {
  container.textContent = '';
  for (const k of kpis) {
    const card = el('div', 'kpi');
    card.appendChild(el('div', 'kpi-value', k.value));
    card.appendChild(el('div', 'kpi-label', k.label));
    container.appendChild(card);
  }
}

module.exports = { renderChart, renderKpis, destroyAllCharts, EMPTY_TEXT };

},
"ui/main.js": function (module, exports, require) {
// App shell: header state, tab bar, routing and shared state.
// Tab renderers live in TABS (see registerTab); an unregistered tab shows a placeholder.
const { buildModel } = require('../model');
const { createSegmentState } = require('../segments');
const { destroyAllCharts } = require('./charts');
const { renderSystemTab } = require('./tab-systems');
const { renderFan360 } = require('./tab-fan360');
const { renderProfile } = require('./tab-profile');
const { renderSegments } = require('./tab-segments');
const { renderRecs } = require('./tab-recs');

const TAB_GROUPS = [
  { label: 'Your systems today', tabs: [
    { id: 'ticketing', label: '1 Ticketing & Entry' },
    { id: 'fnb', label: '2 F&B & Retail' },
    { id: 'groups', label: '3 Groups & Experiences' },
  ] },
  { label: 'Linked', tabs: [
    { id: 'fan360', label: '4 Fan 360' },
    { id: 'profile', label: '5 Individual View' },
    { id: 'segments', label: '6 Segment Builder' },
    { id: 'recs', label: '7 Segment Recommendations' },
  ] },
];
const TAB_IDS = TAB_GROUPS.flatMap((g) => g.tabs.map((t) => t.id));

const state = { tab: 'ticketing', role: 'sales', selectedFanId: null, segment: createSegmentState() };
let model = null;

// Renderer signature: (container, { model, state, goTo, setState, payload }).
const TABS = {
  ticketing: (c, ctx) => renderSystemTab(c, ctx.model.views.ticketing),
  fnb: (c, ctx) => renderSystemTab(c, ctx.model.views.fnb),
  groups: (c, ctx) => renderSystemTab(c, ctx.model.views.groups),
  fan360: (c, ctx) => renderFan360(c, ctx.model.views.fan360),
  profile: (c, ctx) => renderProfile(c, ctx),
  segments: (c, ctx) => renderSegments(c, ctx),
  recs: (c, ctx) => renderRecs(c, ctx),
};

function registerTab(id, renderer) { TABS[id] = renderer; }

function tabLabel(id) {
  for (const g of TAB_GROUPS) for (const t of g.tabs) if (t.id === id) return t.label;
  return id;
}

function renderPlaceholder(container, id) {
  container.textContent = '';
  const p = document.createElement('p');
  p.className = 'placeholder';
  p.textContent = `${tabLabel(id)} is coming together in the next build step.`;
  container.appendChild(p);
}

function renderTabBar() {
  const bar = document.getElementById('tabbar');
  bar.textContent = '';
  TAB_GROUPS.forEach((group, gi) => {
    if (gi > 0) { const sep = document.createElement('div'); sep.className = 'tab-sep'; bar.appendChild(sep); }
    const wrap = document.createElement('div');
    wrap.className = 'tab-group';
    wrap.setAttribute('role', 'tablist');
    wrap.setAttribute('aria-label', group.label);
    const lab = document.createElement('div');
    lab.className = 'tab-group-label';
    lab.textContent = group.label;
    wrap.appendChild(lab);
    const row = document.createElement('div');
    row.className = 'tab-group-tabs';
    for (const t of group.tabs) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.id = `tab-${t.id}`;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(t.id === state.tab));
      b.textContent = t.label;
      b.addEventListener('click', () => onTabClick(t.id));
      row.appendChild(b);
    }
    wrap.appendChild(row);
    bar.appendChild(wrap);
  });
}

function render(payload) {
  const container = document.getElementById('app');
  destroyAllCharts();
  renderTabBar();
  if (!model) return;
  const renderer = TABS[state.tab];
  if (renderer) renderer(container, { model, state, goTo, setState, payload });
  else renderPlaceholder(container, state.tab);
}

function goTo(tabId, payload) {
  if (!TAB_IDS.includes(tabId)) throw new Error(`Unknown tab ${tabId}`);
  state.tab = tabId;
  render(payload);
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function onTabClick(id) { goTo(id); }

function mount(m) {
  model = m;
  render();
}

const api = { state, TABS, TAB_IDS, registerTab, goTo, setState, mount };
if (typeof globalThis !== 'undefined') globalThis.__fan360 = api;

// Paint the loading state first, then build the model on the next tick.
if (typeof document !== 'undefined') {
  renderTabBar();
  setTimeout(() => mount(buildModel()), 0);
}

module.exports = api;

},
"ui/tab-fan360.js": function (module, exports, require) {
// Tab 4: what linking the three systems shows. All figures arrive pre-formatted from the view model.
const { renderChart, renderKpis } = require('./charts');

function node(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Stacked bar whose labels come from roundParts, so the parts visibly add up to the total.
function renderParts(card, spec, totalCaption) {
  const sum = spec.parts.reduce((a, b) => a + b, 0) || 1;
  const bar = node('div', 'parts-bar');
  spec.parts.forEach((p, i) => {
    const seg = node('div', `parts-seg parts-seg-${i}`);
    seg.style.flexGrow = String(Math.max(p, sum * 0.02));
    seg.setAttribute('title', `${spec.names[i]}: ${spec.labels[i]}`);
    bar.appendChild(seg);
  });
  card.appendChild(bar);
  const list = node('ul', 'parts-list');
  spec.names.forEach((name, i) => {
    const li = node('li', 'parts-item');
    li.appendChild(node('span', `parts-swatch parts-seg-${i}`));
    li.appendChild(node('span', 'parts-name', name));
    li.appendChild(node('span', 'parts-value', spec.labels[i]));
    list.appendChild(li);
  });
  const total = node('li', 'parts-item parts-total');
  total.appendChild(node('span', 'parts-swatch parts-swatch-none'));
  total.appendChild(node('span', 'parts-name', totalCaption));
  total.appendChild(node('span', 'parts-value', spec.totalLabel));
  list.appendChild(total);
  card.appendChild(list);
}

function renderFan360(container, view) {
  container.textContent = '';
  container.appendChild(node('p', 'sys-intro', 'Link the records from all three systems and the same fans show up once, with their full value.'));
  const kpis = node('div', 'kpis kpis-hero');
  container.appendChild(kpis);
  renderKpis(kpis, view.kpis);
  // Mark the large tile after the shared renderer has built the cards.
  view.kpis.forEach((k, i) => {
    if (k.size === 'large' && kpis.children[i]) kpis.children[i].className += ' kpi-large';
    if (k.note && kpis.children[i]) kpis.children[i].appendChild(node('div', 'kpi-note', k.note));
  });

  const grid = node('div', 'charts');
  container.appendChild(grid);
  const card = (title, takeaway) => {
    const c = node('section', 'chart-card');
    c.appendChild(node('h3', 'chart-title', title));
    grid.appendChild(c);
    return { c, takeaway: () => c.appendChild(node('p', 'takeaway', takeaway)) };
  };

  const f = card('Linkage funnel: source records to resolved fans', view.takeaways.funnel);
  renderParts(f.c, view.funnel, 'Source records');
  f.takeaway();

  const m = card('How each link was made', view.takeaways.matchBreakdown);
  renderParts(m.c, view.matchBreakdown, 'Candidate links');
  m.takeaway();

  for (const [spec, key] of [[view.overlap, 'overlap'], [view.valueBySystems, 'valueBySystems']]) {
    const c = card(spec.title, view.takeaways[key]);
    const box = node('div', 'chart-box');
    c.c.appendChild(box);
    renderChart(box, spec);
    c.takeaway();
  }
}

module.exports = { renderFan360 };

},
"ui/tab-profile.js": function (module, exports, require) {
// Tab 5: hero picker, search, role toggle and the role-masked unified profile.
// Per-person values are shown as the view model formats them (not scaled).
const { searchFans, fanProfileView, ROLES } = require('../views-profile');
const { SEASONS } = require('../config');

const SOURCE_NAMES = {
  ticketing: 'Ticketing & Entry', fnb: 'F&B & Retail', groups: 'Groups & Experiences',
  experiences: 'Groups & Experiences', surveys: 'Survey', kidsClub: 'Kids Club',
};

function node(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
}

function valueNode(f) {
  return f.restricted ? node('span', 'pill-restricted', f.value) : node('span', 'pf-value', f.value);
}

function renderSwimlanes(lanes) {
  const wrap = node('div', 'lanes');
  const head = node('div', 'lane lane-head');
  head.appendChild(node('div', 'lane-name'));
  const cols = node('div', 'lane-cols');
  for (const yr of SEASONS) cols.appendChild(node('div', 'lane-season', String(yr)));
  head.appendChild(cols);
  wrap.appendChild(head);
  for (const lane of lanes) {
    const row = node('div', 'lane');
    row.appendChild(node('div', 'lane-name', lane.system));
    const body = node('div', 'lane-cols');
    for (const yr of SEASONS) {
      const cell = node('div', 'lane-cell');
      for (const ev of lane.events.filter((e) => e.season === yr)) {
        cell.appendChild(node('div', `lane-event lane-${ev.kind}`, ev.label));
      }
      body.appendChild(cell);
    }
    row.appendChild(body);
    wrap.appendChild(row);
  }
  return wrap;
}

function renderProfileBody(el, view) {
  el.textContent = '';
  const h = view.header;
  const top = node('div', 'pf-header');
  top.appendChild(node('h2', 'pf-name', h.name));
  top.appendChild(node('span', 'pf-meta', `${h.region}, ${h.systems} ${h.systems === 1 ? 'system' : 'systems'}, match confidence ${h.confidence}`));
  top.appendChild(node('span', 'pf-meta pf-role', `Viewing as ${h.roleLabel}`));
  el.appendChild(top);

  const cols = node('div', 'pf-cols');
  const left = node('div', 'pf-col');
  const groups = [];
  for (const f of view.fields) {
    let g = groups.find((x) => x.name === f.group);
    if (!g) { g = { name: f.group, rows: [] }; groups.push(g); }
    g.rows.push(f);
  }
  for (const g of groups) {
    const sec = node('section', 'pf-group');
    sec.appendChild(node('h3', 'pf-group-title', g.name));
    for (const f of g.rows) {
      const row = node('div', 'pf-row');
      row.appendChild(node('span', 'pf-label', f.label));
      row.appendChild(valueNode(f));
      sec.appendChild(row);
    }
    if (g.name === 'Linkage') {
      for (const s of view.sources) {
        const row = node('div', 'pf-row');
        row.appendChild(node('span', 'pf-label', `Linked record (${SOURCE_NAMES[s.source] || s.source})`));
        row.appendChild(node('span', 'pf-value', `${s.id}, ${s.confidence} confidence`));
        sec.appendChild(row);
      }
    }
    left.appendChild(sec);
  }
  cols.appendChild(left);

  const right = node('div', 'pf-col');
  const tl = node('section', 'pf-group');
  tl.appendChild(node('h3', 'pf-group-title', 'Three seasons across systems'));
  tl.appendChild(renderSwimlanes(view.swimlanes));
  right.appendChild(tl);
  if (view.household.length) {
    const hh = node('section', 'pf-group');
    hh.appendChild(node('h3', 'pf-group-title', 'Household'));
    for (const r of view.household) {
      const row = node('div', 'pf-row');
      row.appendChild(node('span', 'pf-label', r.label));
      row.appendChild(valueNode(r));
      hh.appendChild(row);
    }
    right.appendChild(hh);
  }
  cols.appendChild(right);
  el.appendChild(cols);
}

function renderProfile(container, ctx) {
  const { model, state, payload } = ctx;
  if (payload && payload.fanId !== undefined && payload.fanId !== null) state.selectedFanId = payload.fanId;
  const heroes = searchFans(model.fans, '');
  if (state.selectedFanId === null || state.selectedFanId === undefined || !model.fanById.has(state.selectedFanId)) {
    state.selectedFanId = heroes[0].fanId;
  }

  container.textContent = '';
  container.appendChild(node('p', 'sys-intro', 'One linked fan across three seasons and three systems. Switch roles to see what each team is allowed to see.'));
  const bar = node('div', 'pf-bar');
  const chips = node('div', 'chips');
  const search = node('input', 'pf-search');
  search.type = 'search';
  search.placeholder = 'Search fans by name or email';
  search.setAttribute('aria-label', 'Search fans by name or email');
  const toggle = node('div', 'role-toggle');
  toggle.setAttribute('role', 'group');
  toggle.setAttribute('aria-label', 'Role');
  const results = node('div', 'pf-results');
  const body = node('div', 'pf-body');

  function paintChips() {
    chips.textContent = '';
    for (const h of heroes) {
      const b = node('button', 'chip-btn', h.name);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(h.fanId === state.selectedFanId));
      b.addEventListener('click', () => onPick(h.fanId));
      chips.appendChild(b);
    }
  }
  function paintToggle() {
    toggle.textContent = '';
    for (const id of ['sales', 'privacy']) {
      const b = node('button', 'role-btn', ROLES[id]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.role === id));
      b.addEventListener('click', () => onRole(id));
      toggle.appendChild(b);
    }
  }
  function paintResults() {
    results.textContent = '';
    if (!search.value.trim()) return;
    const found = searchFans(model.fans, search.value);
    if (!found.length) { results.appendChild(node('div', 'pf-none', 'No fans match that search')); return; }
    for (const f of found) {
      const b = node('button', 'result-btn', f.name);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(f.fanId === state.selectedFanId));
      b.addEventListener('click', () => onPick(f.fanId));
      results.appendChild(b);
    }
  }
  function paintBody() {
    renderProfileBody(body, fanProfileView(model.fanById.get(state.selectedFanId), state.role, model.world));
  }
  function paintAll() { paintChips(); paintToggle(); paintResults(); paintBody(); }
  // Only the profile, chips and results repaint, so the search box keeps focus and text.
  function onPick(fanId) { state.selectedFanId = fanId; paintAll(); }
  function onRole(role) { state.role = role; paintAll(); }

  search.addEventListener('input', paintResults);
  bar.appendChild(node('span', 'pf-bar-label', 'Hero fans'));
  bar.appendChild(chips);
  bar.appendChild(search);
  bar.appendChild(toggle);
  container.appendChild(bar);
  container.appendChild(results);
  container.appendChild(body);
  paintAll();
}

module.exports = { renderProfile };

},
"ui/tab-recs.js": function (module, exports, require) {
// Tab 7: ranked pattern-detection cards. Each card opens its rule in the Segment Builder.
const { COPY } = require('../config');
const { scaled, fmtCount, fmtMoney } = require('../format');
const { RANKING_NOTE } = require('../recommendations');
const { applyRecommendation } = require('../segments');

function node(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Two bars, segment against baseline. Text comes from the card's own evidence strings.
function renderEvidence(parent, ev) {
  const [s, b] = ev.chart.series[0].map((v) => Math.abs(v));
  const max = Math.max(s, b) || 1;
  const rows = [
    { name: ev.chart.labels[0], value: ev.segmentValue, mag: s, cls: 'ev-seg' },
    { name: ev.chart.labels[1], value: ev.baselineValue, mag: b, cls: 'ev-base' },
  ];
  const chart = node('div', 'ev-chart');
  chart.setAttribute('role', 'img');
  chart.setAttribute('aria-label', `${ev.label}: ${ev.segmentValue} against ${ev.baselineValue}`);
  for (const r of rows) {
    const row = node('div', 'ev-row');
    row.appendChild(node('span', 'ev-name', r.name));
    const track = node('div', 'ev-track');
    const bar = node('div', `ev-bar ${r.cls}`);
    bar.style.width = `${Math.max(2, Math.round((r.mag / max) * 100))}%`;
    bar.setAttribute('title', `${r.name}: ${r.value}`);
    track.appendChild(bar);
    row.appendChild(track);
    row.appendChild(node('span', 'ev-value', r.value));
    chart.appendChild(row);
  }
  parent.appendChild(node('div', 'ev-title', ev.label));
  parent.appendChild(chart);
}

function renderRecs(container, ctx) {
  const { model, state, goTo } = ctx;
  if (!state.recsOpen) {
    state.recsOpen = {};
    for (const c of model.recommendations) state.recsOpen[c.id] = !!c.expanded;
  }

  container.textContent = '';
  container.appendChild(node('h2', 'recs-title', COPY.recsLabel));
  container.appendChild(node('p', 'recs-note', COPY.recsProdNote));
  container.appendChild(node('p', 'recs-note recs-rank', RANKING_NOTE));
  const list = node('div', 'recs-list');
  container.appendChild(list);

  function onOpenBuilder(card) {
    state.segment = applyRecommendation(state.segment, card);
    goTo('segments');
  }
  function onExampleFan(fan) { goTo('profile', { fanId: fan.fanId }); }
  function onToggle(card) { state.recsOpen[card.id] = !state.recsOpen[card.id]; paint(); }

  function paint() {
    list.textContent = '';
    model.recommendations.forEach((card, i) => {
      const open = !!state.recsOpen[card.id];
      const el = node('article', `rec-card${open ? ' rec-open' : ''}`);
      const head = node('div', 'rec-head');
      head.appendChild(node('span', 'rec-rank', String(i + 1)));
      head.appendChild(node('h3', 'rec-name', card.name));
      const toggle = node('button', 'btn btn-quiet rec-toggle', open ? 'Hide details' : 'Show details');
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', String(open));
      toggle.addEventListener('click', () => onToggle(card));
      head.appendChild(toggle);
      el.appendChild(head);

      const stats = node('div', 'rec-stats');
      const stat = (label, value, cls) => {
        const s = node('div', 'rec-stat');
        s.appendChild(node('div', `rec-stat-value ${cls}`, value));
        s.appendChild(node('div', 'rec-stat-label', label));
        stats.appendChild(s);
      };
      stat('fans in the segment', fmtCount(scaled(card.matched)), 'rec-size');
      stat('eligible after consent (email)', fmtCount(scaled(card.eligible)), 'rec-eligible');
      stat('projected value', fmtMoney(card.projectedValue), 'rec-value');
      el.appendChild(stats);

      if (open) {
        const body = node('div', 'rec-body');
        body.appendChild(node('p', 'rec-rule', card.ruleText));
        body.appendChild(node('p', 'rec-assume', card.valueAssumption));
        const ev = node('div', 'rec-evidence');
        renderEvidence(ev, card.evidence);
        body.appendChild(ev);
        const why = node('p', 'rec-why');
        why.appendChild(node('strong', 'rec-why-label', 'Why now: '));
        why.appendChild(node('span', 'rec-why-text', card.whyNow));
        body.appendChild(why);
        if (card.sponsorAudience) body.appendChild(node('p', 'rec-sponsor', card.sponsorAudienceSize));
        el.appendChild(body);
      }

      const actions = node('div', 'rec-actions');
      const go = node('button', 'btn rec-open-btn', 'Open in Segment Builder');
      go.type = 'button';
      go.setAttribute('data-rec', card.id);
      go.addEventListener('click', () => onOpenBuilder(card));
      actions.appendChild(go);
      const hero = card.heroId ? model.fans.find((f) => f.heroId === card.heroId) : null;
      if (hero) {
        const ex = node('button', 'btn btn-quiet rec-example', 'Example fan');
        ex.type = 'button';
        ex.addEventListener('click', () => onExampleFan(hero));
        actions.appendChild(ex);
      }
      el.appendChild(actions);
      list.appendChild(el);
    });
  }
  paint();
}

module.exports = { renderRecs };

},
"ui/tab-segments.js": function (module, exports, require) {
// Tab 6: Segment Builder. Filters on the left; live count, consent waterfall and projections on the right.
// Every figure is rendered from the shared formatters and the segments.js display strings, never re-scaled here.
const { CHANNELS, PLANS, REGIONS } = require('../config');
const { scaled, fmtCount } = require('../format');
const {
  DEFAULT_FILTERS, applyFilters, consentWaterfall, projectResults, projectionDisplay,
  createSegmentState, setFilter, assumptionText, combineProjections,
} = require('../segments');
const { EMPTY_TEXT } = require('./charts');

const PLAN_IDS_2026 = ['choice', 'reserved', 'starter', 'ballpark_pass', 'triple_play', 'single', 'none'];
const DUPLICATE_LABEL = 'Duplicate contacts (already merged by linkage)';

function node(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Control specs grouped by rail section. Every DEFAULT_FILTERS key appears exactly once.
const SECTIONS = [
  { title: 'Ticketing', controls: [
    { key: 'plan2026', kind: 'multi', label: '2026 plan', options: PLAN_IDS_2026.map((id) => ({ value: id, label: PLANS[id] })) },
    { key: 'seasonsActiveMin', kind: 'number', label: 'Seasons active, at least (of 3)', blank: 0, min: 0, max: 3 },
    { key: 'games2026Min', kind: 'number', label: '2026 games attended, at least', min: 0 },
    { key: 'games2026Max', kind: 'number', label: '2026 games attended, at most', min: 0 },
    { key: 'attendanceChangeMaxPct', kind: 'number', label: 'Attendance change 2025 to 2026, at or below (%)' },
    { key: 'keptTransferring2026', kind: 'check', label: 'Kept transferring tickets in 2026' },
    { key: 'neverOwnTicket', kind: 'check', label: 'Never owned a ticket of their own' },
    { key: 'singleGameBefore2026', kind: 'check', label: 'Bought single games before 2026' },
    { key: 'premiumViaTransferOrGroup', kind: 'check', label: 'Reached premium areas by transfer or group' },
    { key: 'excludePremiumOwn', kind: 'check', label: 'Never owned premium seats' },
  ] },
  { title: 'F&B', controls: [
    { key: 'fnbPercentile2026Min', kind: 'number', label: '2026 F&B spend percentile, at least', min: 0, max: 100 },
    { key: 'retailOrApp2026', kind: 'check', label: 'Bought from Team Store or team app in 2026' },
  ] },
  { title: 'Groups', controls: [
    { key: 'groupOutingsMin', kind: 'number', label: 'Group outings, at least', blank: 0, min: 0 },
  ] },
  { title: 'Engagement', controls: [
    { key: 'surveySatMax', kind: 'number', label: 'Latest survey satisfaction, at or below' },
  ] },
  { title: 'Household', controls: [
    { key: 'kidsClubHousehold', kind: 'check', label: 'Household has a Kids Club child (parents only)' },
    { key: 'regions', kind: 'multi', label: 'Region', options: REGIONS.map((r) => ({ value: r, label: r })) },
  ] },
];

const CONTROL_BY_KEY = {};
for (const s of SECTIONS) for (const c of s.controls) CONTROL_BY_KEY[c.key] = c;

const planName = (id) => PLANS[id] || id;

// Short text for each active filter, used for the chips shown after opening from a recommendation.
function describeFilters(f) {
  const out = [];
  if (f.plan2026.length) out.push(`2026 plan: ${f.plan2026.map(planName).join(', ')}`);
  if (f.seasonsActiveMin > 0) out.push(`Seasons active at least ${f.seasonsActiveMin}`);
  if (f.games2026Min !== null && f.games2026Min !== undefined) out.push(`2026 games at least ${f.games2026Min}`);
  if (f.games2026Max !== null && f.games2026Max !== undefined) out.push(`2026 games at most ${f.games2026Max}`);
  if (f.attendanceChangeMaxPct !== null && f.attendanceChangeMaxPct !== undefined) out.push(`Attendance change at or below ${f.attendanceChangeMaxPct}%`);
  if (f.fnbPercentile2026Min !== null && f.fnbPercentile2026Min !== undefined) out.push(`F&B percentile at least ${f.fnbPercentile2026Min}`);
  if (f.keptTransferring2026) out.push('Kept transferring in 2026');
  if (f.retailOrApp2026) out.push('Team Store or app buyer in 2026');
  if (f.groupOutingsMin > 0) out.push(`Group outings at least ${f.groupOutingsMin}`);
  if (f.neverOwnTicket) out.push('Never owned a ticket');
  if (f.singleGameBefore2026) out.push('Single-game buyer before 2026');
  if (f.premiumViaTransferOrGroup) out.push('Premium via transfer or group');
  if (f.excludePremiumOwn) out.push('Never owned premium seats');
  if (f.surveySatMax !== null && f.surveySatMax !== undefined) out.push(`Survey satisfaction at or below ${f.surveySatMax}`);
  if (f.kidsClubHousehold) out.push('Kids Club household (parents only)');
  if (f.regions.length) out.push(`Region: ${f.regions.join(', ')}`);
  return out;
}

// Runs one channel through consent and projection; strings come straight from segments.js.
function channelResult(matchedFans, channelId) {
  const w = consentWaterfall(matchedFans, channelId);
  const proj = projectResults(w.eligible, [channelId]);
  return { id: channelId, w, proj, disp: projectionDisplay(proj) };
}

function renderWaterfall(parent, r, empty) {
  const { w } = r;
  const sum = w.display.parts.reduce((a, b) => a + b, 0) || 1;
  const names = ['Eligible after consent', ...w.steps.map((s) => (s.id === 'duplicate' ? DUPLICATE_LABEL : s.label))];
  const box = node('div', 'wf-box');
  if (empty) {
    box.appendChild(node('div', 'chart-empty', EMPTY_TEXT));
  } else {
    const bar = node('div', 'parts-bar');
    w.display.parts.forEach((p, i) => {
      const seg = node('div', `parts-seg ${i === 0 ? 'wf-eligible' : 'wf-removed'}`);
      seg.style.flexGrow = String(Math.max(p, sum * 0.01));
      seg.setAttribute('title', `${names[i]}: ${w.display.labels[i]}`);
      bar.appendChild(seg);
    });
    box.appendChild(bar);
  }
  parent.appendChild(box);
  const list = node('ul', 'parts-list');
  names.forEach((name, i) => {
    const li = node('li', 'parts-item');
    li.appendChild(node('span', `parts-swatch ${i === 0 ? 'wf-eligible' : 'wf-removed'}`));
    li.appendChild(node('span', 'parts-name', i === 0 ? name : `Removed: ${name}`));
    li.appendChild(node('span', i === 0 ? 'parts-value wf-eligible-value' : 'parts-value', i === 0 ? fmtCount(scaled(w.eligible)) : w.display.labels[i]));
    list.appendChild(li);
  });
  parent.appendChild(list);
}

function renderProjection(parent, disp, empty) {
  if (empty) parent.appendChild(node('div', 'chart-empty', EMPTY_TEXT));
  const table = node('div', 'proj-rows');
  for (const row of disp.rows) {
    const line = node('div', `proj-row${row.label === 'Projected revenue' ? ' proj-revenue' : ''}`);
    line.appendChild(node('span', 'proj-label', row.label));
    line.appendChild(node('span', 'proj-value', row.value));
    table.appendChild(line);
  }
  parent.appendChild(table);
}

function renderSegments(container, ctx) {
  const { model, state } = ctx;
  if (!state.segment) state.segment = createSegmentState();
  if (!state.savedSegments) state.savedSegments = [];

  container.textContent = '';
  const layout = node('div', 'seg-layout');
  const rail = node('aside', 'seg-rail');
  const main = node('div', 'seg-main');
  layout.appendChild(rail);
  layout.appendChild(main);
  container.appendChild(layout);

  const banner = node('div', 'seg-banner-slot');
  const countBox = node('div', 'seg-count-box');
  const resultsPanel = node('div', 'seg-panel');
  const savedBox = node('div', 'seg-saved');
  const nameInput = node('input', 'seg-name');

  function onFilter(key, value) {
    state.segment = setFilter(state.segment, key, value);
    paintResults();
  }

  function buildControl(c) {
    const f = state.segment.filters;
    const wrap = node('div', 'ctl');
    if (c.kind === 'check') {
      const label = node('label', 'ctl-check');
      const box = node('input', 'ctl-input');
      box.type = 'checkbox';
      box.checked = !!f[c.key];
      box.setAttribute('data-filter', c.key);
      box.addEventListener('change', () => onFilter(c.key, !!box.checked));
      label.appendChild(box);
      label.appendChild(node('span', 'ctl-text', c.label));
      wrap.appendChild(label);
    } else if (c.kind === 'number') {
      const label = node('label', 'ctl-num');
      label.appendChild(node('span', 'ctl-text', c.label));
      const inp = node('input', 'ctl-input ctl-number');
      inp.type = 'number';
      if (c.min !== undefined) inp.min = String(c.min);
      if (c.max !== undefined) inp.max = String(c.max);
      const cur = f[c.key];
      inp.value = cur === null || cur === undefined || cur === c.blank ? '' : String(cur);
      inp.setAttribute('data-filter', c.key);
      inp.setAttribute('aria-label', c.label);
      inp.addEventListener('input', () => {
        const raw = String(inp.value).trim();
        if (raw === '') { onFilter(c.key, c.blank !== undefined ? c.blank : null); return; }
        const v = Number(raw);
        if (Number.isFinite(v)) onFilter(c.key, v);
      });
      label.appendChild(inp);
      wrap.appendChild(label);
    } else {
      wrap.appendChild(node('div', 'ctl-text ctl-group-label', c.label));
      const opts = node('div', 'ctl-multi');
      for (const o of c.options) {
        const label = node('label', 'ctl-check');
        const box = node('input', 'ctl-input');
        box.type = 'checkbox';
        box.checked = f[c.key].includes(o.value);
        box.setAttribute('data-filter', c.key);
        box.setAttribute('data-value', o.value);
        box.addEventListener('change', () => {
          const cur = state.segment.filters[c.key];
          const next = box.checked ? cur.concat(o.value) : cur.filter((x) => x !== o.value);
          onFilter(c.key, next);
        });
        label.appendChild(box);
        label.appendChild(node('span', 'ctl-text', o.label));
        opts.appendChild(label);
      }
      wrap.appendChild(opts);
    }
    return wrap;
  }

  function paintRail() {
    rail.textContent = '';
    const head = node('div', 'rail-head');
    head.appendChild(node('h2', 'rail-title', 'Filters'));
    const reset = node('button', 'btn btn-quiet', 'Reset filters');
    reset.type = 'button';
    reset.addEventListener('click', onReset);
    head.appendChild(reset);
    rail.appendChild(head);
    for (const s of SECTIONS) {
      const sec = node('section', 'rail-section');
      sec.appendChild(node('h3', 'rail-section-title', s.title));
      for (const c of s.controls) sec.appendChild(buildControl(c));
      rail.appendChild(sec);
    }
  }

  function onReset() {
    state.segment = { ...createSegmentState(), channelIds: state.segment.channelIds.slice() };
    paintRail();
    paintResults();
  }

  function onChannel(id) {
    const cur = state.segment.channelIds;
    let next = cur.includes(id) ? cur.filter((x) => x !== id) : cur.concat(id);
    if (!next.length) next = cur;
    state.segment = { ...state.segment, channelIds: CHANNELS.map((c) => c.id).filter((x) => next.includes(x)) };
    paintResults();
  }

  function onSave() {
    const matched = applyFilters(model.fans, state.segment.filters).length;
    const name = nameInput.value.trim() || `Segment ${state.savedSegments.length + 1}`;
    state.savedSegments.push({
      name,
      filters: { ...state.segment.filters, plan2026: state.segment.filters.plan2026.slice(), regions: state.segment.filters.regions.slice() },
      matched,
    });
    nameInput.value = '';
    paintSaved();
  }

  function onLoad(seg) {
    state.segment = {
      ...state.segment,
      filters: { ...DEFAULT_FILTERS, ...seg.filters, plan2026: seg.filters.plan2026.slice(), regions: seg.filters.regions.slice() },
      fromRecommendation: null,
    };
    paintRail();
    paintResults();
  }

  function paintSaved() {
    savedBox.textContent = '';
    if (!state.savedSegments.length) return;
    savedBox.appendChild(node('h3', 'rail-section-title', 'Saved segments'));
    for (const seg of state.savedSegments) {
      const row = node('div', 'saved-row');
      row.appendChild(node('span', 'saved-name', seg.name));
      row.appendChild(node('span', 'saved-count', `${fmtCount(scaled(seg.matched))} fans`));
      const b = node('button', 'btn btn-quiet', 'Load');
      b.type = 'button';
      b.addEventListener('click', () => onLoad(seg));
      row.appendChild(b);
      savedBox.appendChild(row);
    }
  }

  // Repaints only the results side, so number inputs in the rail keep focus while typing.
  function paintResults() {
    const seg = state.segment;
    const matchedFans = applyFilters(model.fans, seg.filters);
    const empty = matchedFans.length === 0;
    const results = seg.channelIds.map((id) => channelResult(matchedFans, id));

    banner.textContent = '';
    if (seg.fromRecommendation) {
      const b = node('div', 'seg-banner');
      b.appendChild(node('div', 'seg-banner-title', `From recommendation: ${seg.fromRecommendation.name}`));
      const chips = node('div', 'filter-chips');
      for (const t of describeFilters(seg.filters)) chips.appendChild(node('span', 'filter-chip', t));
      b.appendChild(chips);
      banner.appendChild(b);
    }

    countBox.textContent = '';
    countBox.appendChild(node('div', 'seg-count', fmtCount(scaled(matchedFans.length))));
    countBox.appendChild(node('div', 'seg-count-label', 'fans match these filters'));
    for (const r of results) {
      const line = node('div', 'seg-eligible-line');
      line.appendChild(node('span', 'seg-eligible-name', `Eligible after consent, ${CHANNELS.find((c) => c.id === r.id).label}: `));
      line.appendChild(node('span', `seg-eligible seg-eligible-${r.id}`, fmtCount(scaled(r.w.eligible))));
      countBox.appendChild(line);
    }

    resultsPanel.textContent = '';
    const chipRow = node('div', 'chan-row');
    chipRow.appendChild(node('span', 'pf-bar-label', 'Channels'));
    for (const ch of CHANNELS) {
      const b = node('button', 'chip-btn', ch.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(seg.channelIds.includes(ch.id)));
      b.setAttribute('data-channel', ch.id);
      b.addEventListener('click', () => onChannel(ch.id));
      chipRow.appendChild(b);
    }
    resultsPanel.appendChild(chipRow);

    const cols = node('div', 'seg-cols');
    for (const r of results) {
      const ch = CHANNELS.find((c) => c.id === r.id);
      const card = node('section', 'chart-card seg-channel');
      card.appendChild(node('h3', 'chart-title', ch.label));
      if (ch.note) card.appendChild(node('p', 'seg-note', ch.note));
      card.appendChild(node('h4', 'seg-sub', 'Consent waterfall'));
      renderWaterfall(card, r, empty);
      card.appendChild(node('h4', 'seg-sub', 'Projected results'));
      renderProjection(card, r.disp.perChannel[0], empty);
      card.appendChild(node('p', 'seg-assumption', assumptionText(ch)));
      cols.appendChild(card);
    }
    resultsPanel.appendChild(cols);

    if (results.length > 1) {
      const combined = combineProjections(results.map((r) => r.proj));
      const box = node('section', 'chart-card seg-combined');
      box.appendChild(node('h3', 'chart-title', 'All selected channels'));
      for (const row of combined) {
        const line = node('div', 'proj-row proj-revenue');
        line.appendChild(node('span', 'proj-label', row.label));
        line.appendChild(node('span', 'proj-value', row.value));
        box.appendChild(line);
      }
      resultsPanel.appendChild(box);
    }
  }

  // Save row sits under the rail so both roles can reach it.
  const saveRow = node('div', 'save-row');
  nameInput.type = 'text';
  nameInput.placeholder = 'Segment name';
  nameInput.setAttribute('aria-label', 'Segment name');
  const saveBtn = node('button', 'btn', 'Save segment');
  saveBtn.type = 'button';
  saveBtn.addEventListener('click', onSave);
  saveRow.appendChild(nameInput);
  saveRow.appendChild(saveBtn);

  main.appendChild(node('p', 'sys-intro', 'Build an audience from linked attributes. Consent and minors rules apply before anything is sent.'));
  const top = node('div', 'seg-top');
  top.appendChild(node('h2', 'seg-title', 'Segment Builder'));
  top.appendChild(countBox);
  main.appendChild(top);
  main.appendChild(banner);
  main.appendChild(resultsPanel);
  main.appendChild(saveRow);
  main.appendChild(savedBox);

  paintRail();
  paintSaved();
  paintResults();
}

module.exports = { renderSegments, describeFilters, CONTROL_BY_KEY };

},
"ui/tab-systems.js": function (module, exports, require) {
