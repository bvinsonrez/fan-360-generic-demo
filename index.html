"views-fan360.js": function (module, exports, require) {
// Tab 4: what linking the three systems shows. Person counts are scaled ×SCALE;
// per-fan values (annual value by number of systems) are not.
const { scaled, fmtCount, fmtMoney, fmtPct, fmtMultiple, roundParts } = require('./format');
const { normEmail } = require('./fans');

const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

function fan360Metrics(world, linkage, fans) {
  const { stats } = linkage;
  const multi = fans.filter((f) => f.systems >= 2);
  const single = fans.filter((f) => f.systems === 1);
  const anonTxns = world.fnbAnonymous.reduce((a, g) => a + g.txns, 0);

  // Combined marketing list: every email held in ticketing, groups and identified F&B.
  const listEmails = new Set();
  for (const t of world.ticketing) if (t.email) listEmails.add(normEmail(t.email));
  for (const g of world.groups) {
    if (g.organizer.email) listEmails.add(normEmail(g.organizer.email));
    for (const k of g.knownAttendees) if (k.email) listEmails.add(normEmail(k.email));
  }
  for (const t of world.fnbIdentified) if (t.email) listEmails.add(normEmail(t.email));
  const fanByEmail = new Map();
  for (const f of fans) for (const e of f.emails) fanByEmail.set(e, f.fanId);
  const fansWithEmail = new Set();
  for (const e of listEmails) {
    const id = fanByEmail.get(e);
    if (id !== undefined) fansWithEmail.add(id);
  }

  return {
    recordsPerFan: stats.sourceRecords / stats.resolvedFans,
    multiSystemShare: multi.length / fans.length,
    valueMultiple: mean(multi.map((f) => f.annualValue)) / mean(single.map((f) => f.annualValue)),
    fnbIdentifiedShare: world.fnbIdentified.length / (world.fnbIdentified.length + anonTxns),
    dupContactShare: (listEmails.size - fansWithEmail.size) / listEmails.size,
    // supporting counts (raw, unscaled)
    multiCount: multi.length,
    listEmails: listEmails.size,
    duplicateEmails: listEmails.size - fansWithEmail.size,
    meanValue: { single: mean(single.map((f) => f.annualValue)), multi: mean(multi.map((f) => f.annualValue)) },
  };
}

function fan360View(world, linkage, fans) {
  const { stats } = linkage;
  const m = fan360Metrics(world, linkage, fans);

  const funnel = {
    ...roundParts([scaled(stats.resolvedFans), scaled(stats.sourceRecords - stats.resolvedFans)]),
    names: ['Resolved fans', 'Duplicate records merged'],
  };
  const conf = stats.byConfidence;
  const matchBreakdown = {
    ...roundParts([scaled(conf.high), scaled(conf.medium), scaled(conf.low)]),
    names: ['High (email/phone)', 'Medium (name + ZIP)', 'Low (shown, not merged)'],
  };

  // Overlap of the three systems: which combination each fan appears in.
  const combos = [
    ['Ticketing only', 'T'], ['F&B & Retail only', 'F'], ['Groups & Experiences only', 'G'],
    ['Ticketing + F&B', 'TF'], ['Ticketing + Groups', 'TG'], ['F&B + Groups', 'FG'], ['All three', 'TFG'],
  ];
  const sysKey = (f) => {
    const src = new Set(f.nodes.map((n) => n.source));
    return (src.has('ticketing') ? 'T' : '') + (src.has('fnb') ? 'F' : '')
      + (src.has('groups') || src.has('experiences') ? 'G' : '');
  };
  const comboCount = Object.fromEntries(combos.map(([, k]) => [k, 0]));
  for (const f of fans) comboCount[sysKey(f)]++;
  // Same split as the value-multiple KPI: single-system vs. 2+ systems.
  const valueData = [Math.round(m.meanValue.single), Math.round(m.meanValue.multi)];
  // Tab 2 shows the identified share to one decimal; derive the anonymous share from that
  // displayed figure so the two always add to 100.0% on screen.
  const identifiedShown = fmtPct(m.fnbIdentifiedShare, 1);
  const anonShown = `${(100 - parseFloat(identifiedShown)).toFixed(1)}%`;

  const kpis = [
    { id: 'resolvedFans', label: 'Resolved fans', value: fmtCount(scaled(fans.length)) },
    { id: 'multiSystem', label: 'Fans in 2+ systems', value: fmtPct(m.multiSystemShare) },
    { id: 'valueMultiple', label: 'Annual value, multi-system vs. single-system fans', value: fmtMultiple(m.valueMultiple), size: 'large' },
    { id: 'anonFnb', label: 'F&B transactions with no person attached', value: anonShown },
    { id: 'dupContacts', label: 'Duplicate contacts removed from the marketing list', value: fmtCount(scaled(m.duplicateEmails)),
      note: `${fmtPct(m.dupContactShare)} of ${fmtCount(scaled(m.listEmails))} emails` },
  ];

  const overlap = {
    id: 'overlap', type: 'bar', unit: 'count', indexAxis: 'y', title: 'Where each resolved fan appears',
    labels: combos.map(([l]) => l),
    series: [{ name: 'Fans', data: combos.map(([, k]) => scaled(comboCount[k])) }],
  };
  const valueBySystems = {
    id: 'valueBySystems', type: 'bar', unit: 'money', title: 'Average annual known spend per fan: one system vs. two or more',
    labels: ['1 system', '2+ systems'],
    series: [{ name: 'Annual value per fan', data: valueData }],
    highlightIndex: 1,
  };

  const takeaways = {
    funnel: `${funnel.totalLabel} source records resolve to ${funnel.labels[0]} fans once duplicates across systems are merged.`,
    matchBreakdown: `Most links rest on an exact email or phone match; ${matchBreakdown.labels[2]} weaker lookalikes are shown for review, not merged.`,
    overlap: `${fmtPct(m.multiSystemShare)} of fans show up in more than one system, and no single system sees them whole.`,
    valueBySystems: `Fans in 2+ systems are worth ${fmtMultiple(m.valueMultiple)} a single-system fan each year (${fmtMoney(m.meanValue.multi)} vs. ${fmtMoney(m.meanValue.single)}).`,
  };

  return { kpis, funnel, matchBreakdown, overlap, valueBySystems, takeaways, metrics: m };
}

module.exports = { fan360View, fan360Metrics };

},
"views-profile.js": function (module, exports, require) {
// Tab 5: fan search and the role-masked unified profile. Per-person values are not scaled.
const { SEASONS, PLANS, CHANNELS } = require('./config');
const { fmtMoney } = require('./format');

const ROLES = { sales: 'Ticket Sales Rep', privacy: 'Privacy & Data Governance' };
const HERO_ORDER = ['H1', 'H2', 'H3', 'H4'];
const MAX_RESULTS = 20;
const RESTRICTED = 'Restricted';

// Children are not Fans, so a search over fans can never return one.
function searchFans(fans, query) {
  const q = String(query || '').trim().toLowerCase();
  const heroes = HERO_ORDER.map((id) => fans.find((f) => f.heroId === id)).filter(Boolean);
  if (!q) return heroes;
  const hit = (f) => f.name.toLowerCase().includes(q) || f.emails.some((e) => e.toLowerCase().includes(q));
  const out = heroes.filter(hit);
  for (const f of fans) {
    if (out.length >= MAX_RESULTS) break;
    if (!f.heroId && hit(f)) out.push(f);
  }
  return out.slice(0, MAX_RESULTS);
}

const STATUS_LABEL = { opt_in: 'Opted in', opt_out: 'Opted out', none: 'No record' };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// world indexes are built once per world.
const indexes = new WeakMap();
function worldIndex(world) {
  let ix = indexes.get(world);
  if (ix) return ix;
  ix = {
    games: new Map(world.games.map((g) => [g.gameId, g])),
    groups: new Map(world.groups.map((g) => [g.bookingId, g])),
    experiences: new Map(world.experiences.map((e) => [e.expId, e])),
  };
  indexes.set(world, ix);
  return ix;
}

function nodeConfidence(fan) {
  const best = new Map();
  for (const e of fan.evidence) {
    const rank = e.method === 'fuzzy' ? 'medium' : 'high';
    for (const id of [e.a, e.b]) if (best.get(id) !== 'high') best.set(id, rank);
  }
  return (node) => best.get(node.id) || 'high';
}

function swimlanes(fan, world) {
  const ix = worldIndex(world);
  const ticketing = [], fnb = [], groups = [];
  const lastDate = (yr) => `${yr}-09-30`;
  for (const yr of SEASONS) {
    const parts = [];
    if (fan.ticketGames[yr] > 0) parts.push(`${fan.ticketGames[yr]} games`);
    if (fan.plans[yr] !== 'none') parts.push(PLANS[fan.plans[yr]]);
    if (parts.length) ticketing.push({ season: yr, date: lastDate(yr), kind: 'attendance', label: parts.join(', ') });
    if (fan.transfersSent[yr] > 0) ticketing.push({ season: yr, date: lastDate(yr), kind: 'transfer', label: `${fan.transfersSent[yr]} tickets transferred` });
    if (fan.fnbSpend[yr] > 0) {
      const retail = fan.retailOrApp[yr] ? ' (includes Team Store or app)' : '';
      fnb.push({ season: yr, date: lastDate(yr), kind: 'spend', label: `${fmtMoney(Math.round(fan.fnbSpend[yr]))} F&B${retail}` });
    }
  }
  for (const n of fan.nodes) {
    if (n.source === 'groups') {
      const g = ix.groups.get(n.id.split(':')[0]);
      if (!g) continue;
      const game = ix.games.get(g.gameId);
      const role = n.id.endsWith(':organizer') ? '' : ' (attendee)';
      groups.push({ season: g.season, date: game ? game.date : lastDate(g.season), kind: 'group', label: `Group outing: ${g.type}${role}` });
    } else if (n.source === 'experiences') {
      const e = ix.experiences.get(n.id);
      if (e) groups.push({ season: e.season, date: lastDate(e.season), kind: 'experience', label: `Experience: ${e.kind}` });
    }
  }
  groups.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return [
    { system: 'Ticketing & Entry', events: ticketing },
    { system: 'F&B & Retail', events: fnb },
    { system: 'Groups & Experiences', events: groups },
  ];
}

function fanProfileView(fan, role, world) {
  const privacy = role === 'privacy';
  const field = (group, label, value, restrictedForSales = false) => (
    restrictedForSales && !privacy
      ? { group, label, value: RESTRICTED, restricted: true }
      : { group, label, value: String(value), restricted: false });

  const fields = [
    field('Contact', 'Email', fan.emails.join(', ') || 'None on file', true),
    field('Contact', 'Phone', fan.phones.join(', ') || 'None on file', true),
    field('Contact', 'ZIP', fan.zip, true),
    field('Contact', 'Region', fan.region),
  ];
  for (const yr of SEASONS) {
    fields.push(field('Ticketing', `${yr} plan`, PLANS[fan.plans[yr]]));
  }
  fields.push(
    field('Ticketing', '2026 games attended (incl. group outings)', fan.games[2026]),
    field('Ticketing', '2026 tickets transferred', fan.transfersSent[2026]),
    field('F&B', '2026 F&B spend', fmtMoney(Math.round(fan.fnbSpend[2026]))),
    field('Engagement', 'Group outings', fan.groupOutings),
    field('Engagement', 'Survey satisfaction', fan.surveySat === null ? 'No response' : `${fan.surveySat} of 10`),
  );
  for (const ch of CHANNELS.filter((c) => c.id !== 'social')) {
    const d = fan.consentDetail[ch.id];
    fields.push(field('Consent', `${ch.label} status`, STATUS_LABEL[fan.consent[ch.id]]));
    fields.push(field('Consent', `${ch.label} source and date`, d ? `${d.source}, ${d.date}` : 'No record', true));
  }
  fields.push(field('Consent', 'Do-not-contact', fan.dnc ? 'Yes' : 'No'));
  fields.push(
    field('Linkage', 'Match confidence', fan.confidence),
    field('Linkage', 'Match evidence', fan.evidence.length
      ? fan.evidence.map((e) => `${e.a} to ${e.b} by ${e.method}`).join('; ')
      : 'Single source record', true),
  );

  const conf = nodeConfidence(fan);
  const sources = fan.nodes.map((n) => ({ source: n.source, id: n.id, confidence: conf(n) }));

  const kids = fan.kidsClubChildren;
  let household = [];
  if (kids.length) {
    household = privacy
      ? kids.map((k, i) => ({ label: 'Kids Club', value: `Member ${i + 1}: active, joined ${k.joinDate}`, restricted: false }))
      : [{ label: 'Kids Club', value: `${plural(kids.length, 'Kids Club member', 'Kids Club members')} (restricted)`, restricted: true }];
  }

  return {
    header: {
      fanId: fan.fanId, name: fan.name, heroId: fan.heroId, region: fan.region,
      role, roleLabel: ROLES[role], confidence: fan.confidence, systems: fan.systems,
    },
    fields,
    swimlanes: swimlanes(fan, world),
    sources,
    household,
  };
}

module.exports = { searchFans, fanProfileView, ROLES };

},
"views-systems.js": function (module, exports, require) {
// Tabs 1–3: what each source system can show on its own, before linking.
// Every count is an aggregate over the sample, scaled ×SCALE; per-game ratios are not scaled.
const { SEASONS, GATES, GROUP_TYPES, PREMIUM_AREAS, MEMBER_PLANS } = require('./config');
const { scaled, fmtCount, fmtMoney, fmtPct } = require('./format');

const LAST = SEASONS[SEASONS.length - 1];
const PLAN_ORDER = ['season_pre', 'choice', 'reserved', 'starter', 'ballpark_pass', 'triple_play', 'single'];
// Three buckets for the plan chart. Members sit on the baseline and carry the accent.
const PLAN_BUCKETS = [
  { name: 'Season ticket or membership', plans: ['season_pre', ...MEMBER_PLANS], highlight: true },
  { name: 'Pass or bundle', plans: ['ballpark_pass', 'triple_play'] },
  { name: 'Single game', plans: ['single'] },
];
const seasonLabels = SEASONS.map(String);
const sum = (a) => a.reduce((x, y) => x + y, 0);

function gamesBySeason(world) {
  const out = {};
  for (const yr of SEASONS) out[yr] = world.games.filter((g) => g.season === yr);
  return out;
}

function ticketingView(world) {
  const perGame = new Map();
  const gate = {};
  for (const yr of SEASONS) gate[yr] = Object.fromEntries(GATES.map((g) => [g.id, 0]));
  let ticketed = 0;
  for (const s of world.scans) {
    perGame.set(s.gameId, (perGame.get(s.gameId) || 0) + 1);
    gate[s.season][s.gate]++;
    if (s.tktId && s.season === LAST) ticketed++;
  }
  const bySeason = gamesBySeason(world);
  const maxGames = Math.max(...SEASONS.map((yr) => bySeason[yr].length));
  const attendance = SEASONS.map((yr) => ({
    name: String(yr),
    data: Array.from({ length: maxGames }, (_, i) => (bySeason[yr][i] ? scaled(perGame.get(bySeason[yr][i].gameId) || 0) : null)),
  }));

  const planCount = {};
  const transfers = {};
  let noShows = 0;
  for (const yr of SEASONS) { planCount[yr] = Object.fromEntries(PLAN_ORDER.map((p) => [p, 0])); transfers[yr] = 0; }
  for (const t of world.ticketing) {
    for (const yr of SEASONS) {
      const s = t.seasons[yr];
      if (s.plan !== 'none') planCount[yr][s.plan]++;
      transfers[yr] += s.transfersSent;
      if (yr === LAST) noShows += s.noShows;
    }
  }
  const planSeries = PLAN_BUCKETS.map((b) => ({
    name: b.name, highlight: b.highlight,
    data: SEASONS.map((yr) => scaled(sum(b.plans.map((p) => planCount[yr][p])))),
  }));

  const totalScans = world.scans.length;
  const lastScans = sum(Object.values(gate[LAST]));
  const gatesSorted = GATES.map((g) => ({ label: g.label, v: scaled(gate[LAST][g.id]) })).sort((a, b) => b.v - a.v);
  const transferData = SEASONS.map((yr) => scaled(transfers[yr]));
  const transfersRose = transferData[transferData.length - 1] > transferData[transferData.length - 2];
  const noShowRate = noShows / (ticketed + noShows);

  return {
    intro: 'Every scan and plan sold through the ticketing platform and team app, three seasons. It shows how many tickets were used and where fans walked in.',
    kpis: [
      { id: 'scans', label: `Scans, ${SEASONS[0]}–${LAST}`, value: fmtCount(scaled(totalScans)) },
      { id: 'avgAttendance', label: `Average scans per game, ${LAST}`, value: fmtCount(scaled(lastScans) / bySeason[LAST].length) },
      { id: 'noShowRate', label: `No-show rate on ticketed seats, ${LAST}`, value: fmtPct(noShowRate) },
      { id: 'transfers', label: `Tickets transferred, ${LAST}`, value: fmtCount(scaled(transfers[LAST])) },
    ],
    charts: [
      { id: 'attendanceByGame', type: 'line', unit: 'count', title: 'Scans by home game, 2024–2026', seasonSeries: true,
        labels: Array.from({ length: maxGames }, (_, i) => `Game ${i + 1}`), series: attendance },
      { id: 'planMix', type: 'bar', unit: 'count', stacked: true, title: 'Ticket accounts by season: members vs. everyone else', labels: seasonLabels, series: planSeries },
      { id: 'scansByGate', type: 'bar', unit: 'count', title: `Scans by gate, ${LAST}, busiest first`, labels: gatesSorted.map((g) => g.label),
        series: [{ name: 'Scans', data: gatesSorted.map((g) => g.v) }] },
      { id: 'transfers', type: 'bar', unit: 'count', title: transfersRose ? `Ticket transfers rose in ${LAST}` : 'Tickets transferred by season', labels: seasonLabels,
        series: [{ name: 'Transfers sent', data: transferData }], highlightIndex: transfersRose ? SEASONS.length - 1 : undefined },
    ],
    cantTell: 'Who is actually in the seat when a ticket is transferred, or what they spend once inside.',
  };
}

function fnbView(world) {
  const bySeason = gamesBySeason(world);
  const revByGame = new Map();
  const cat = {};
  const venue = {};
  const txns = { identified: world.fnbIdentified.length, anonymous: 0 };
  for (const yr of SEASONS) {
    cat[yr] = { food: 0, beverage: 0, merch: 0 };
    venue[yr] = { concessions: 0, mobile: 0, team_store: 0 };
  }
  for (const a of world.fnbAnonymous) {
    revByGame.set(a.gameId, (revByGame.get(a.gameId) || 0) + a.revenue);
    txns.anonymous += a.txns;
    for (const c of ['food', 'beverage', 'merch']) cat[a.season][c] += a.byCategory[c];
    // Anonymous swipes: food and beverage at the stands, merchandise at the Team Store.
    venue[a.season].concessions += a.byCategory.food + a.byCategory.beverage;
    venue[a.season].team_store += a.byCategory.merch;
  }
  for (const t of world.fnbIdentified) {
    if (t.gameId) revByGame.set(t.gameId, (revByGame.get(t.gameId) || 0) + t.amount);
    cat[t.season][t.category] += t.amount;
    venue[t.season][t.venue] += t.amount;
  }
  const scansByGame = new Map();
  for (const s of world.scans) if (s.season === LAST) scansByGame.set(s.gameId, (scansByGame.get(s.gameId) || 0) + 1);
  const lastGames = bySeason[LAST];
  const revenue = lastGames.map((g) => Math.round(scaled(revByGame.get(g.gameId) || 0)));
  const inParkLast = sum(lastGames.map((g) => revByGame.get(g.gameId) || 0));
  const scansLast = sum([...scansByGame.values()]);
  const totalLast = cat[LAST].food + cat[LAST].beverage + cat[LAST].merch;
  const identifiedShare = txns.identified / (txns.identified + txns.anonymous);
  const money = (v) => Math.round(scaled(v));

  return {
    intro: 'Concession stands, mobile orders and the Team Store. Plenty of revenue detail, very little about who is buying.',
    kpis: [
      { id: 'revenue', label: `F&B and retail revenue, ${LAST}`, value: fmtMoney(scaled(totalLast)) },
      { id: 'perCap', label: `In-park spend per scan, ${LAST}`, value: fmtMoney(inParkLast / scansLast) },
      { id: 'identifiedShare', label: 'Transactions tied to a person', value: fmtPct(identifiedShare, 1) },
    ],
    charts: [
      { id: 'revenueByGame', type: 'line', unit: 'money', title: `F&B and retail revenue by game, ${LAST}`,
        labels: lastGames.map((_, i) => `Game ${i + 1}`),
        series: [{ name: 'Revenue', data: revenue }] },
      { id: 'categoryMix', type: 'bar', unit: 'money', title: 'Revenue by category, 2024–2026', seasonSeries: true,
        labels: ['Food', 'Beverage', 'Merchandise'],
        series: SEASONS.map((yr) => ({ name: String(yr), data: ['food', 'beverage', 'merch'].map((k) => money(cat[yr][k])) })) },
      { id: 'venueMix', type: 'bar', unit: 'money', title: 'Revenue by point of sale, 2024–2026', seasonSeries: true,
        labels: ['Concessions', 'Mobile orders', 'Team Store'],
        series: SEASONS.map((yr) => ({ name: String(yr), data: ['concessions', 'mobile', 'team_store'].map((k) => money(venue[yr][k])) })) },
      { id: 'identifiedShare', type: 'doughnut', unit: 'count', title: 'Transactions tied to a person, 2024–2026',
        labels: ['Tied to a person', 'Anonymous card swipe'],
        series: [{ name: 'Transactions', data: [scaled(txns.identified), scaled(txns.anonymous)] }], highlightIndex: 0 },
    ],
    cantTell: 'Who most of these buyers are, or whether the fan at the Team Store is the same fan who holds a ticket plan.',
  };
}

function medianInt(values) {
  const v = values.slice().sort((a, b) => a - b);
  const mid = v.length >> 1;
  return v.length % 2 ? v[mid] : Math.round((v[mid - 1] + v[mid]) / 2);
}

function groupsView(world) {
  const PREMIUM = new Set(PREMIUM_AREAS);
  const byType = {};
  const people = {};
  const exp = {};
  for (const yr of SEASONS) {
    byType[yr] = Object.fromEntries(GROUP_TYPES.map((t) => [t, 0]));
    people[yr] = { organizers: 0, known: 0, headcount: 0 };
    exp[yr] = { tour: 0, suite: 0, rooftop_deck: 0, premiumGroups: 0 };
  }
  for (const g of world.groups) {
    byType[g.season][g.type]++;
    const p = people[g.season];
    p.organizers++;
    p.known += g.knownAttendees.length;
    p.headcount += Math.max(0, g.size - 1 - g.knownAttendees.length);
    if (PREMIUM.has(g.seatArea)) exp[g.season].premiumGroups++;
  }
  for (const e of world.experiences) exp[e.season][e.kind]++;
  const lastBookings = world.groups.filter((g) => g.season === LAST);
  const lastAttendees = sum(lastBookings.map((g) => g.size));
  const lastNamed = people[LAST].organizers + people[LAST].known;
  const others = medianInt(world.groups.map((g) => g.size)) - 1;
  const mostlyHeadcount = SEASONS.every((yr) => people[yr].headcount > people[yr].organizers + people[yr].known);

  return {
    intro: 'Group outings, ballpark tours, suites and the Rooftop Deck. The organizer is known; most of the people they bring are a headcount.',
    kpis: [
      { id: 'bookings', label: `Group bookings, ${LAST}`, value: fmtCount(scaled(lastBookings.length)) },
      { id: 'attendees', label: `Group attendees, ${LAST}`, value: fmtCount(scaled(lastAttendees)) },
      { id: 'namedShare', label: 'Group attendees with a name on file', value: fmtPct(lastNamed / lastAttendees) },
    ],
    charts: [
      { id: 'bookingsByType', type: 'bar', unit: 'count', title: 'Group bookings by type, 2024–2026', labels: GROUP_TYPES, seasonSeries: true,
        series: SEASONS.map((yr) => ({ name: String(yr), data: GROUP_TYPES.map((t) => scaled(byType[yr][t])) })) },
      { id: 'knownVsHeadcount', type: 'bar', unit: 'count', stacked: true,
        title: mostlyHeadcount ? 'Most group attendees are a headcount, not a name' : 'Group attendees: named vs. headcount', labels: seasonLabels,
        series: [
          { name: 'Name on file (organizer or booking link)', data: SEASONS.map((yr) => scaled(people[yr].organizers + people[yr].known)), highlight: true },
          { name: 'Headcount only', data: SEASONS.map((yr) => scaled(people[yr].headcount)) },
        ] },
      { id: 'toursPremium', type: 'bar', unit: 'count', title: 'Tours and premium bookings, 2024–2026', seasonSeries: true,
        labels: ['Ballpark tours', 'Suites', 'Rooftop Deck', 'Groups in premium areas'],
        series: SEASONS.map((yr) => ({ name: String(yr), data: ['tour', 'suite', 'rooftop_deck', 'premiumGroups'].map((k) => scaled(exp[yr][k])) })) },
    ],
    cantTell: `Whether the ${others} other people in a group ever come back on their own.`,
    medianOthers: others,
  };
}

module.exports = { ticketingView, fnbView, groupsView };

}
